<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゴーカート 3D ビューア</title>
<link rel="stylesheet" href="viewer.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<header id="toolbar" class="toolbar">
  <strong class="title">ゴーカート 3D</strong>
  <span class="group" id="gConfig" role="group" aria-label="構成">
    <button type="button" data-config="summer">夏</button><button type="button" data-config="winter">冬（スノーモービル型）</button><button type="button" data-config="transport">搬送</button><button type="button" data-config="water">水（将来版）</button>
  </span>
  <label class="field">乗員
    <select id="rider"><option value="adult">大人</option><option value="child">子ども</option><option value="none">なし</option></select>
  </label>
  <label class="check"><input type="checkbox" id="delica"> デリカの荷室</label>
  <label class="check"><input type="checkbox" id="dims"> 寸法</label>
  <span class="group" id="gView" role="group" aria-label="視点">
    <button type="button" data-view="iso">斜め</button><button type="button" data-view="side">横</button><button type="button" data-view="top">上</button><button type="button" data-view="front">前</button>
  </span>
  <button type="button" id="partsBtn" aria-expanded="false" aria-controls="partsPanel">部品</button>
  <button type="button" id="themeBtn" aria-label="明るさの切り替え">明暗</button>
</header>
<aside id="partsPanel" class="panel" hidden>
  <div class="panel-head"><strong>部品の表示</strong><span><button type="button" id="allOn">すべて表示</button> <button type="button" id="allOff">すべて隠す</button></span></div>
  <ul id="partsList"></ul>
</aside>
<div id="status" class="status" aria-live="polite"></div>
<div id="futureNote" class="future-note" hidden>将来版の参考表示（要求ではありません、D-027）</div>
<div id="loading" class="loading">設計データと 3D ライブラリを読み込んでいます…</div>
<div id="error" class="error" hidden></div>
<script type="module" src="main.js"></script>
<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('error');
    if (el && !el.textContent) { el.hidden = false; el.textContent = 'スクリプトの読み込みに失敗しました: ' + (e.message || '') + '（three.js は cdn.jsdelivr.net から読み込みます）'; }
  });
</script>
</body>
</html>
