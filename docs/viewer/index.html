<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go-kart 3D viewer and driving screen</title>
<link rel="stylesheet" href="viewer.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="top">
  <h1 id="title">Go-kart 3D viewer</h1>
  <span class="tools"><button id="theme" type="button" aria-label="Toggle dark mode">Theme</button>
  <button id="panelBtn" type="button" aria-expanded="false" aria-controls="panel">Panel</button></span>
</header>
<div class="banner" id="banner">Rough values from step 1.2. Grip, ski grip, track resistance in fresh snow, and plough resistance are assumed (Q-014). An illustration, not a verification.</div>
<div id="loading" class="loading">Loading the record and the 3D library...</div>
<div id="error" class="error" hidden></div>
<main class="layout" id="app" hidden>
  <section class="stage">
    <div id="view" class="view">
      <button id="hudToggle" class="hud-toggle" type="button" hidden>Hide HUD</button>
      <div id="hud" class="hud" hidden></div>
      <div id="warn" class="warn"></div>
      <div id="fit" class="fit" hidden></div>
      <div id="touch" class="touch" hidden>
        <div class="pad">
          <button type="button" data-k="left" aria-label="Steer left">&#9664;</button>
          <button type="button" data-k="right" aria-label="Steer right">&#9654;</button>
        </div>
        <div class="pad">
          <button type="button" data-k="brake">Brake</button>
          <button type="button" data-k="throttle">Go</button>
          <button type="button" data-k="reset">R</button>
        </div>
      </div>
    </div>
    <p class="hint" id="hint"></p>
  </section>
  <aside class="panel" id="panel"></aside>
</main>
<script type="module" src="main.js"></script>
<script>
  // shown if main.js fails before it can report (old browser, blocked CDN)
  window.addEventListener('error', function (e) {
    var el = document.getElementById('error');
    if (el && !el.textContent) { el.hidden = false; el.textContent = 'Script error: ' + (e.message || 'a file could not be loaded') + '. Check the network (three.js comes from cdn.jsdelivr.net).'; }
  });
</script>
</body>
</html>
