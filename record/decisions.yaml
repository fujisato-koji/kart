kind: decision
schema: 1
items:
  - id: D-001
    date: 2026-11-03
    by: owner
    what: Build one go-kart with one seat, for the owner's private land, to be driven mainly by a child and also by an adult, in summer and in winter. The power source is not preset; the form step compares an engine and an electric drive.
    touches:
      - kart.seats
      - R-01
      - R-02
      - R-03
  - id: D-002
    date: 2026-11-03
    by: owner
    what: Keep the record public in fujisato-koji/kart, created from the traceable-design template. The record is written in English and the conversation with the assistant is in Japanese. Private facts such as the place stay outside the repository.
    touches:
      - D-001
  - id: D-003
    date: 2026-11-03
    by: owner
    what: The top speed is set for a child, at 30 km/h.
    touches:
      - kart.speed_max_kmh
      - R-01
  - id: D-004
    date: 2026-11-03
    by: owner
    what: The speed is set for a child, but the strength and the seat and pedal positions must also fit an adult.
    touches:
      - R-02
      - R-03
  - id: D-005
    date: 2026-11-03
    by: owner
    what: The kart runs only on private land, on paved ground, gravel or dirt, and grass. It does not run on public roads.
    touches:
      - R-04
  - id: D-006
    date: 2026-11-03
    by: owner
    what: In winter the kart runs on private land on packed snow or ice and on fresh snow up to 30 cm deep.
    touches:
      - snow.depth_max_cm
      - R-05
      - R-06
  - id: D-007
    date: 2026-11-03
    by: owner
    what: The lowest air temperature in use is -10 degC.
    touches:
      - ambient.temp_min_c
      - R-07
  - id: D-008
    date: 2026-11-03
    by: owner
    what: The budget for parts and materials is 100,000 JPY, including tax, shipping, and the winter parts, and excluding tools. It is a guideline that may be passed a little; when it is likely to be passed, the assistant names the parts that drive it and the owner decides. The owner would buy a welder if the chosen form needs one.
    touches:
      - budget.parts_jpy
      - R-08
  - id: D-009
    date: 2026-11-03
    by: owner
    what: The heaviest adult who drives weighs 100 kg.
    touches:
      - rider.mass_max_kg
      - R-02
  - id: D-010
    date: 2026-11-03
    by: owner
    what: The youngest driver is a 5-year-old child.
    touches:
      - rider.stature_min_cm
      - R-03
  - id: D-011
    date: 2026-11-03
    by: owner
    what: On snow the kart may be slow. The top speed of 30 km/h applies on paved ground.
    touches:
      - R-01
      - R-05
      - R-06
  - id: D-012
    date: 2026-11-03
    by: owner
    what: The kart is kept outdoors under a roof, and is carried in a Mitsubishi Delica D:5, in which it should be easy to load and carry.
    touches:
      - R-07
      - R-14
  - id: D-013
    date: 2026-11-03
    by: owner
    what: With an engine, refuelling between runs is acceptable. With batteries, two to three hours of driving per charge is wanted, depending on the trade-off.
    touches:
      - kart.run_time_min
      - R-07
  - id: D-014
    date: 2026-11-03
    by: owner
    what: The kart must not be damaged on a fairly steep slope. It may climb slowly.
    touches:
      - site.grade_max_pct
      - R-16
  - id: D-015
    date: 2026-11-03
    by: owner
    what: The top speed on paved ground is lowered to 20 km/h, to see whether the kart can be made cheaper.
    options:
      - 30 km/h as in D-003
      - 20 km/h
    touches:
      - kart.speed_max_kmh
      - R-01
    supersedes: D-003
  - id: D-016
    date: 2026-11-03
    by: owner
    what: The tallest adult who drives is about 170 cm tall.
    touches:
      - rider.stature_max_cm
      - R-03
  - id: D-017
    date: 2026-11-03
    by: owner
    what: Make the design concrete with new parts that are readily available in Japan, with realistic shapes, and show the designed kart in 3D to grasp what will be built; the 3D view need not be a driving game. This settles item 1 of docs/02-form.md#proposal as new parts (L2). The other items of that proposal are taken as the working basis of step 1.3 until the owner decides them.
    touches:
      - R-08
      - cost.total_l2_e1_w1_jpy
  - id: D-018
    date: 2026-11-04
    by: owner
    what: No lower speed limit for the child is needed; the kart has one top speed for every driver.
    options:
      - an adult sets a lower top speed for the child (R-17)
      - one top speed for every driver
    touches:
      - R-17
      - H-08
  - id: D-019
    date: 2026-11-04
    by: owner
    what: The kart should also be driven on public roads, for short trips and leisurely runs near home in daytime, so it is to be equipped and registered as the law requires (most likely as a four-wheel moped, a minicar). The child drives only on private land. This changes D-005, which kept the kart off public roads.
    touches:
      - D-005
      - R-18
  - id: D-020
    date: 2026-11-04
    by: owner
    what: The top speed is about 30 km/h, on public roads and on private land alike (one top speed, D-018). This replaces the 20 km/h of D-015.
    options:
      - 20 km/h as in D-015
      - about 30 km/h
      - fast on roads and slow on private land, switched
    touches:
      - kart.speed_max_kmh
      - R-01
    supersedes: D-015
  - id: D-021
    date: 2026-11-04
    by: owner
    what: Road use comes first. The slope the kart must climb is lowered to what the engine allowed on public roads can do, instead of choosing a larger engine for the slope.
    touches:
      - site.grade_max_pct
      - R-16
  - id: D-022
    date: 2026-11-04
    by: owner
    what: Reflect the proposal of docs/02-form.md#road in the design and the 3D view. The working basis becomes a used 50 cc four-stroke scooter engine with its CVT, centrifugal clutch, and final reduction in one unit, driving the rear axle by one chain; a roll bar over the driver's head that also serves as the 1 m marker; and the equipment the law asks for road use. The owner may still change the engine choice.
    touches:
      - engine
      - R-18
      - R-19
  - id: D-023
    date: 2026-11-04
    by: owner
    what: The kart is to be a personal vehicle for the far outdoors, in the owner's words like a kick scooter for the far outdoors. In winter it is changed into a snowmobile form - two front skis, one rear rubber track, and a sled bottom - to cross fresh snow that may lie about 1 m deep where nobody clears it, and in summer it is changed back to tyres for roads and private land. Aim at fresh snow 1 m deep and confirm it by the snowshoe test of Q-012. This raises the 30 cm of D-006 and starts a new pass of step 1.2.
    options:
      - fresh snow up to 30 cm with skis and chains or a pair of tracks (D-006)
      - a snowmobile form changed each winter, aiming at 1 m of fresh snow
    touches:
      - D-006
      - snow.depth_max_cm
      - R-06
      - R-28
  - id: D-024
    date: 2026-11-04
    by: owner
    what: The owner would like the kart, if it can be done, to drive from a shore straight into a lake, move on as a boat, and drive out again. Step 1.2 finds what that takes and what it costs before the owner confirms it.
    touches:
      - R-27
  - id: D-025
    date: 2026-11-04
    by: owner
    what: Settles items 1, 2, and 5 of docs/02-form.md#outdoor. The winter form is the snowmobile form W3, driven by the summer 50 cc scooter unit (D1). R-12 is relaxed for the snowmobile form only, which runs only on snow - its tipping ratio need be at least kart.tip_ratio_snow_min, above the snow's grip. Item 3 (water) waits until the owner has heard what a ship inspection involves.
    options:
      - W3 the snowmobile form, or W1 kept for packed snow only
      - D1 the summer engine, or D2 the donor's engine in winter
      - R-12 relaxed for the snowmobile form, or the full margin on every setup
    touches:
      - D-023
      - R-12
      - R-28
      - kart.tip_ratio_snow_min
  - id: D-026
    date: 2026-11-04
    by: owner
    what: The driver may sit or stand, but if standing would keep the kart off public roads, the kart is ridden seated. A minicar needs a seat with a seat belt and a head restraint (R-22), so the kart stays seated. This settles Q-026.
    touches:
      - Q-026
      - R-22
  - id: D-027
    date: 2026-11-04
    by: owner
    what: Settles item 3 of docs/02-form.md#outdoor. The water requirement R-27 is withdrawn. Water use is kept only as a future development, shown in the 3D view as an option (side floats and an electric outboard on the tub) without a requirement; the tub stays for the snow and as safety buoyancy (R-29). Q-028 is closed until such a version is taken up.
    options:
      - the tub floats only for safety, and the owner asks the transport bureau before any boat use
      - R-27 withdrawn, the tub kept for snow and safety
      - boat use on an inspection pursued now, with side floats
    touches:
      - R-27
      - Q-028
      - D-024
  - id: D-028
    date: 2026-11-04
    by: owner
    what: R-29 keeps only the driver's safety - on ice and near water a life jacket and no seat belt, and nothing of the kart holding the driver. The kart need not float. This settles Q-030; the sled pan keeps its bottom strips and bow and loses its foam and the right pod, which were there only to float the kart.
    options:
      - R-29 for the driver only
      - the kart carries floats in winter so that it floats too
    touches:
      - R-29
      - Q-030
      - sled_pan
  - id: D-029
    date: 2026-11-04
    by: owner
    what: Record W4 - the sled pan carrying most of the weight in snow and the rear tyres, pressed down and wearing chains, pushing - as a winter candidate beside the snowmobile form, and test the summer form with chains in fresh snow before the donor snowmobile is bought.
    touches:
      - R-06
      - D-025
  - id: D-030
    date: 2026-11-04
    by: owner
    what: Riders are 6 years old and up, instead of 5 (D-010). The kart is ridden astride, like an ATV or a snowmobile, with the feet on footrests beside the seat and the rider leaning into turns; the owner accepts this active riding so that the kart can be short and narrow with the engine under or behind the seat. Measures that keep a rider safe if the kart tips or rolls are to be designed.
    options:
      - a seated kart with the legs forward, for a 5-year-old too
      - a straddle kart for riders of 6 and up, ridden actively
    touches:
      - D-010
      - rider.stature_min_cm
      - R-03
      - R-12
      - R-19
      - R-22
      - R-24
  - id: D-031
    date: 2026-11-04
    by: owner
    what: The kart keeps four wheels. One front wheel was considered for its simplicity - the donor scooter's whole front end with its brake and speedometer - and a triangular sled bottom, but with the straddle kart's centre of mass it tips far more easily (1.2.19) and would need the seat lowered a long way.
    options:
      - one front wheel, with the seat lowered
      - four wheels
    touches:
      - D-030
      - R-12
  - id: D-032
    date: 2026-11-04
    by: owner
    what: Buggy-size tyres stay on all year. In winter height-adjustable skis bolt to the steering knuckles inside the front wheels (W6 of 1.2.19), and chains go on the rear tyres as needed. This replaces the large tyres changed each winter (W5), which were the working basis of 1.3, and makes the inside skis the winter form; outside skis remain the choice if more stability is wanted.
    options:
      - W5, large rear tyres and skis changed each winter
      - W6, buggy tyres all year with skis inside the front wheels
      - W6 with skis outside the front wheels
    touches:
      - D-025
      - D-029
      - R-28
      - yr.tyre_dia_mm
  - id: D-033
    date: 2026-11-04
    by: owner
    what: The kart stays a home build, and its parts list is cut. A road-registered 50 cc ATV costs about 198,000 to 298,000 JPY new and mostly 60,000 to 160,000 JPY used with papers (1.5.3), less than the kart's parts were. The list now takes the cheaper running donor, ATV knuckles and drum brake hubs in place of kart spindles, hubs, and cable discs, an LCD meter with its own sensor, ATV wheels with tyres and fenders as sold, the pan's sheet cut to order, and ski brackets made in house.
    options:
      - build with new parts as listed before
      - build with the parts list cut
      - buy a new road-registered 50 cc ATV
      - buy a used one with papers
    touches:
      - R-08
      - D-008
      - D-030
  - id: D-034
    date: 2026-11-04
    by: owner
    what: The navigator is in Japanese. Its own display is Japanese, and the record's statements are shown in Japanese from a table of translations kept beside the site data; the record, the reasoning pages, and the code stay English (D-002).
    options:
      - navigator in English as the record
      - navigator in Japanese, record in English
    touches:
      - D-002
  - id: D-035
    date: 2026-11-04
    by: owner
    what: R-03 is reworded for the straddle kart (D-030) - the seat, footrests, and handlebar fit riders from a 6-year-old child to an adult, the child on bolt-on steps - in place of the seat and pedals of the seated kart.
    options:
      - keep the seated kart's wording
      - reword for the straddle kart
    touches:
      - R-03
      - D-030
  - id: D-036
    date: 2026-11-04
    by: owner
    what: The rear wheels follow the ground on springs - the axle in two bearings on a swing arm pivoted just behind the engine unit, level with its output so that the chain keeps its length, and one shock between the arm and the frame. The front stays rigid on its low-pressure tyres; ATV A-arms and a pivoting front beam were not taken.
    options:
      - rigid on the tyres alone
      - rear swing arm with one shock, front rigid
      - springs front and rear
      - a front beam pivoting on the centre line
    touches:
      - Q-038
      - D-030
  - id: D-037
    date: 2026-11-04
    by: owner
    what: The frame is made low and small and cheaper where its shape allows. The engine unit sits on spine rails just above the sled pan, which lowers the seat and the centre of mass; with that the track, the hoop, and the handlebar come down and in, and the rear overhang shortens. The bearing outriggers and the middle bearing go; the frame is of two tube sizes, the rear triangulated so that the shock's load closes within it, and is checked as a space frame and for interferences.
    options:
      - keep the frame of 1.3 and reinforce the spine
      - lower and smaller, of two tube sizes
    touches:
      - Q-035
      - D-030
      - R-14
  - id: D-038
    date: 2026-11-04
    by: owner
    what: For rough ground the kart stands 150 mm off the ground under its frame, at the clearance of a small sport quad (1.3.19). The frame and the sled pan under it go up by about 40 mm and the seat back to 600 mm, giving up part of the lower seat of D-037.
    options:
      - keep the lower seat, 112 mm under the frame in summer with the sled pan off
      - 150 mm under the frame, the seat at 600 mm
    touches:
      - D-037
      - Q-042
      - R-04
  - id: D-039
    date: 2026-11-04
    by: owner
    what: The front wheels follow the ground on springs too, by the cheapest of the means compared in 1.3.20 - the front beam cut into two swing axles, each turning on a pivot near the centre line level with the tie rods' inner ends, with one shock each of the rear's kind to a cross tube over the front. ATV A-arms bought as a kit (about 70,000 to 73,000 JPY, M104) were judged too dear.
    options:
      - stay rigid and ride drops slowly
      - softer, larger front tyres
      - swing axles with two shocks, made in house
      - double A-arms made in house with two shocks
      - an ATV A-arm kit with two shocks
    touches:
      - Q-042
      - D-036
      - R-04
  - id: D-040
    date: 2026-11-04
    by: owner
    what: The frame meets fatigue on rough ground by its shape and its joints - seat rails of the larger tube under the saddle, from the upper rails down to the spine ahead of the footboards, so that spine and seat rails work as a truss; tubes fitted to each other and welded all round, no intermediate plates fillet-welded on the spine, the posts, or the footboards' supports, and gussets where the posts and struts meet; and the welds looked over for cracks before each day's riding (OP-01).
    options:
      - a thicker spine tube
      - seat rails as a truss, with the joints detailed and inspected
    touches:
      - Q-041
      - H-06
  - id: D-041
    date: 2026-11-04
    by: owner
    what: The front end takes form S1 of 1.2.20 - upper and lower A-arms each side with the knuckle between their ends, one coil-over from each lower arm to a node of the upper rails, a triangulated nose box carrying the arms' pivots, the shocks' tops, and the stem's two bearings, and tie rods from a plate on the stem, their inner ends at the height that keeps the toe change least; it replaces the swing axles of D-039, which change the camber too much over the travel
    options:
      - S1 double A-arms
      - S2 one arm a side on a fore-and-aft axis (the swing axles of D-039)
      - S3 a leading arm a side
      - S4 rigid beam
    touches:
      - Q-043
      - R-04
    supersedes: D-039
  - id: D-042
    date: 2026-11-05
    by: owner
    what: The frame's ends lose what carries little. At the rear the swing arm's pivot stays level with the engine's output, carried by two tubes rising from the spine's rear cross tube to the seat rails' rear ends behind the saddle; the protective hoop stands there, leaning back, and carries the rear shock's top on a cross tube between its legs; the struts, the upper rails behind the seat, and the number plate's frame go, the plate and the rear lamps riding on the swing arm. At the front the nose box's front panel is the bumper, ahead of the tyres, and the separate bumper with its struts goes. A pivot right on the spine rails was chosen first; the owner moved to the pivot at the output's height when a faulty search said no single shock fitted the low pivot, and kept it once a corrected search (K-019) found layouts for both, since the low pivot changes the chain's centre distance by about 45 mm against 14 mm.
    options:
      - rear - the pivot right on the spine rails, with a rocker and link for the shock
      - rear - the pivot level with the output on the rising tubes, the shock's top on the hoop
      - rear - no springs, the axle on the spine
      - rear - the posts, struts, and upper rails as they were
      - front - the nose box's front panel as the bumper
      - front - the separate bumper as it was
    touches:
      - R-02
      - R-19
      - D-036
      - D-041
  - id: D-043
    date: 2026-11-05
    by: owner
    what: The swing arm's pivot moves down onto the line from the engine's output to the axle, so that the chain's centre distance is longest at rest and changes by about 2 mm over the travel, and the chain is sized for its longest distance. With the pivot level with the output (D-042) the distance grew by about 6 mm toward full bump, and the 76-link chain, sized at rest, would have pulled tight about 6 mm into the bump and carried the springs' load through the sprockets and bearings. With the pivot lower, the arm's brace at full bump would meet the rising tubes where they lean back from the pivot, so they now go straight up through the pivot tube to a knee above the brace's reach and lean back from there; the shock's lower eye moves to keep the motion ratio as it was.
    options:
      - the pivot on the line from the output to the axle
      - the pivot level with the output, a 78-link chain, and a tensioner taking up about 43 mm of chain
    touches:
      - D-036
      - D-042
  - id: D-044
    date: 2026-11-05
    by: owner
    what: The frame takes form A of 1.2.21, with fewer welds and straight tubes only. Out go the nose box's second pair of rear uprights, which carried little, its rear top cross tube, whose share of an end-on blow the uprights take, and the seat rails' rear cross tube, whose share of the hoop's sideways push the hoop's own cross tube takes; the tubes from the seat rails down to the spine's front ends stay, keeping the range low at the box's rear uprights' joints (K-021). The box's rear lower cross tube is one tube of the spine's size from spine rail to spine rail, with the box's lower rails welded to it; each seat rail is one straight tube, the rising tubes leaning out to them above their knee; and each top rail of the box is one size through the shocks' node. The sled pan loses the bow that cut the box's lower rails. The frame came to 69 tubes as cut with 134 welded ends, against 79 and 154 counted the same way, and 0.4 kg lighter; B's open box sides wait on the joints' fatigue categories (Q-046).
    options:
      - A - the idle tubes out and the runs straightened
      - B - A with the nose box's sides as open frames
      - the frame as it is
    touches:
      - D-040
      - D-041
      - D-042
      - D-043
  - id: D-045
    date: 2026-11-05
    by: owner
    what: The rear shock's lower eye sits in a clevis of two plates welded to the back of the swing arm's brace, in place of a stub of tube that reached back to it and bent at about 89 MPa, the arm's highest; the arm's safety factor rises from 3.27 to 3.48 and the motion ratio stays. The owner had first asked for a cross tube between the arm's sides under the eye; it would bend about as the brace does and lift the eye about 45 mm, the ratio then falling to about 0.35 at full bump against 0.47.
    options:
      - the eye in a clevis of plates on the brace
      - a cross tube between the arm's sides under the eye, the brace and the stub gone
      - a cross tube under the eye, the brace kept
    touches:
      - D-036
      - D-043
