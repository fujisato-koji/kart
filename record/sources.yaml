    title: Richmond, Motion Resistance of Wheeled Vehicles in Snow, CRREL Report 95-7, 1995
    url: https://rosap.ntl.bts.gov/view/dot/14081/dot_14081_DS1.pdf
    retrieved: 2026-11-03
    license: US government work, approved for public release
    read: partial
    note: Read by a helper through the abstract, Table 1, and equations 1 to 8. Sinkage z = h(1 - rho0/rhof) and final density rhof = 0.519 + 0.0023 pmax (Mg/m3, pmax in kPa), fitted to wheeled vehicles in snow 10 to 37 cm deep with initial density 0.11 to 0.25 Mg/m3.
