kind: hazard
schema: 1
items:
  - id: H-01
    text: The kart hits an obstacle, a building, a vehicle, or a person.
    phases:
      - operate
    at_risk: The driver and people nearby.
    controls:
      - R-01
      - R-09
      - R-13
  - id: H-02
    text: The drive keeps pushing after the driver lets go or loses control.
    phases:
      - operate
    at_risk: The driver and people nearby.
    controls:
      - R-10
  - id: H-03
    text: Hair, clothing such as a scarf, or fingers are caught in the chain, sprockets, belt, or turning axle.
    phases:
      - build
      - operate
    at_risk: The driver and helpers.
    controls:
      - R-11
  - id: H-04
    text: The driver touches a hot engine, exhaust, or motor, or the battery overheats or burns.
    phases:
      - operate
    at_risk: The driver and helpers.
    controls:
      - R-11
  - id: H-05
    text: The kart tips over in a turn or on a slope.
    phases:
      - operate
    at_risk: The driver.
    controls:
      - R-12
      - R-19
  - id: H-06
    text: The steering, an axle, the frame, or the seat breaks under an adult.
    phases:
      - operate
    at_risk: The driver.
    controls:
      - R-02
  - id: H-07
    text: Braking or steering is lost on snow or ice.
    phases:
      - operate
    at_risk: The driver and people nearby.
    controls:
      - R-05
      - R-09
  - id: H-08
    text: A small child drives faster than the child can control.
    phases:
      - operate
    at_risk: The child and people nearby.
    controls:
      - R-01
  - id: H-09
    text: The kart rolls off the ramp or falls while being loaded or unloaded.
    phases:
      - operate
    at_risk: The person loading it and people nearby.
    controls:
      - R-15
  - id: H-10
    text: Petrol catches fire while refuelling or near the hot engine, or exhaust gas builds up when the engine runs in a closed shed.
    phases:
      - operate
    at_risk: The driver, helpers, and children nearby.
    controls:
      - OP-03.02
      - OP-03.03
  - id: H-11
    text: On water or on ice the kart capsizes, swamps, or breaks through the ice, and the driver is held under by the seat belt or the roll bar, drowns, or is chilled in cold water.
    phases:
      - operate
    at_risk: The driver.
    controls:
      - R-29
