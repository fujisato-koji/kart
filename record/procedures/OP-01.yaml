kind: procedure
schema: 1
items:
  - id: OP-01
    title: Check before a run
    steps:
      - id: OP-01.01
        action: Check the tyres for damage and set their pressure to what the tyre is marked with (Q-036).
      - id: OP-01.02
        action: Check that the chain and axle guards are on and the chain is tight.
        controls:
          - H-03
      - id: OP-01.03
        action: Push the kart and pull each brake lever in turn; the wheels it brakes must lock.
        controls:
          - H-01
          - H-07
      - id: OP-01.04
        action: Turn the throttle grip and let go; it must spring back to idle on its own.
        controls:
          - H-02
      - id: OP-01.05
        action: Test both stop switches, the one on the handlebar and the tether.
        controls:
          - H-02
      - id: OP-01.06
        action: For a child, bolt the steps on the footboards and check that the child, standing on them, clears the seat and holds the grips with bent arms.
        values:
          - rider.stature_min_cm
          - rider.stature_max_cm
      - id: OP-01.07
        action: Look over the frame's welds for cracks - the spine between the footboards, the seat rails, the rising tubes and the pivot tube behind the engine, the hoop's legs, the nose box and the A-arms' pivots, and the swing arm; do not ride with a crack.
        controls:
          - H-06
      - id: OP-01.08
        action: Check that the rider wears the protective gear of R-31, with long hair inside the helmet, and no scarf.
        controls:
          - H-03
      - id: OP-01.09
        action: Clear the driving area of people, vehicles, and objects.
        controls:
          - H-01
