kind: procedure
schema: 1
items:
  - id: OP-02
    title: Start and drive
    steps:
      - id: OP-02.01
        action: An adult starts the engine outdoors with the donor's starter, the kart held by a brake lever.
        controls:
          - H-10
      - id: OP-02.02
        action: The rider sits astride, clips the tether to the clothing, puts both feet on the footboards, and holds the grips.
        controls:
          - H-02
      - id: OP-02.03
        action: Drive on level ground first; keep to kart.speed_max_kmh, or the child limit.
        values:
          - kart.speed_max_kmh
        controls:
          - H-08
        limits:
          - kart.speed_max_kmh
      - id: OP-02.04
        action: Climb and descend slopes straight, leaning forward uphill and back downhill, at full throttle uphill and at walking pace downhill; never turn across a slope.
        values:
          - site.grade_max_pct
        controls:
          - H-05
        limits:
          - site.grade_max_pct
      - id: OP-02.05
        action: To stop on a slope, use both brakes, not the throttle.
        controls:
          - H-05
      - id: OP-02.06
        action: In winter, drive slowly and brake early on snow and ice.
        controls:
          - H-07
