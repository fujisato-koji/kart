kind: procedure
schema: 1
items:
  - id: OP-04
    title: Change to the winter form
    steps:
      - id: OP-04.01
        action: On level ground, lift the kart onto four stands at the winter height, with the engine stopped and cold.
        values:
          - dsn.winter_lift_mm
        controls:
          - H-10
      - id: OP-04.02
        action: Take off the rear wheels and fit the large low-pressure tyres on the same hubs.
        values:
          - w5.tyre_dia_mm
          - w5.tyre_width_mm
      - id: OP-04.03
        action: Change the axle sprocket to the large one, fit the winter chain, tension it, and refit the chain guard.
        values:
          - dsn.winter_chain_links
        controls:
          - H-03
      - id: OP-04.04
        action: Take off the front wheels with their brake discs and bolt the skis with their stanchions onto the spindles.
        values:
          - ski.width_mm
          - ski.contact_length_mm
      - id: OP-04.05
        action: Lower the kart, check that the steering moves freely from lock to lock, that the rear brake holds, and that the chain runs free.
        controls:
          - H-01
          - H-07
