kind: procedure
schema: 1
items:
  - id: OP-04
    title: Change to the winter form
    steps:
      - id: OP-04.01
        action: On level ground, lift the front of the kart onto a stand, with the engine stopped.
        controls:
          - H-10
      - id: OP-04.02
        action: Bolt a ski to each steering knuckle inside the front wheel and set its height - below the tyre for deep snow, so that the front wheels are lifted, or a little above it where the ground is firm.
        values:
          - ski.width_mm
          - ski.contact_length_mm
          - dsn.ski_y_mm
      - id: OP-04.03
        action: Fit the chains on the rear tyres if the snow asks for them.
        controls:
          - H-07
      - id: OP-04.04
        action: Lower the kart and check that the steering moves freely from lock to lock, that the skis clear the brake discs and tie rods, and that both brakes hold.
        controls:
          - H-01
          - H-07
