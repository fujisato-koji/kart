kind: procedure
schema: 1
items:
  - id: OP-06
    title: Change back to the summer form
    steps:
      - id: OP-06.01
        action: On level ground, lift the kart onto four stands at the winter height, with the engine stopped and cold.
        controls:
          - H-10
      - id: OP-06.02
        action: Take off the skis, the winter chain, the brake disc with both calipers, and the track unit.
      - id: OP-06.03
        action: Refit the rear axle in the pillow blocks, the axle sprocket, the brake disc with both calipers, the hubs, and the wheels, and tension the summer chain.
        controls:
          - H-01
          - H-03
      - id: OP-06.04
        action: Refit the front wheels, lower the kart, and check the steering, the brakes, and the lamps before any road use.
        controls:
          - H-01
