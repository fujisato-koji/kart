kind: open
schema: 1
items:
  - id: Q-001
    kind: question
    text: How heavy is the heaviest adult who will drive? The strength is assumed for 100 kg until the owner answers.
    waits_for: owner
    affects:
      - rider.mass_max_kg
      - R-02
    opened: 2026-11-03
    phase: design
    closed_by: D-009
    closed: 2026-11-03
  - id: Q-002
    kind: question
    text: How tall is the tallest adult who will drive? The youngest is a 5-year-old (D-010); the lower end of the seat and pedal range is set from the statistics of 5-year-olds. The upper end is assumed at 185 cm until the owner answers.
    waits_for: owner
    affects:
      - rider.stature_min_cm
      - rider.stature_max_cm
      - R-03
    opened: 2026-11-03
    phase: design
    closed_by: D-016
    closed: 2026-11-03
  - id: Q-003
    kind: question
    text: Does the top speed of 30 km/h have to be reached on snow, or is a lower speed enough on packed snow and in fresh snow? R-05 and R-06 ask only that the kart runs, turns, and stops on snow.
    waits_for: owner
    affects:
      - R-05
      - R-06
    opened: 2026-11-03
    phase: design
    closed_by: D-011
    closed: 2026-11-03
  - id: Q-004
    kind: question
    text: Set the longest stopping distance from the top speed from a go-kart standard or kart rules. Until then it is assumed at 6 m, about 0.6 g.
    waits_for: assistant
    affects:
      - kart.stop_distance_max_m
      - R-09
    opened: 2026-11-03
    phase: design
  - id: Q-005
    kind: question
    text: Set the smallest ratio of half the track width to the height of the centre of mass, so that the kart slides before it tips, from tyre friction data and any standard. Until then it is assumed at 1.5. Also decide whether R-12 must hold standing sideways on site.grade_max_pct, which needs a wider track (form.track_min_slope_m, check K-001).
    waits_for: assistant
    affects:
      - kart.tip_ratio_min
      - R-12
    opened: 2026-11-03
    phase: design
  - id: Q-006
    kind: question
    text: Where is the kart kept (indoors, under a roof, outdoors), and must it be carried in a car or a truck? This sets the size and mass limits and whether it stands in the cold before a run.
    waits_for: owner
    affects:
      - R-07
    opened: 2026-11-03
    phase: design
    closed_by: D-012
    closed: 2026-11-03
  - id: Q-007
    kind: question
    text: How often is the kart used, and by when should it be ready? The run time is settled by D-013.
    waits_for: owner
    affects:
      - R-08
    opened: 2026-11-03
    phase: design
  - id: Q-008
    kind: question
    text: How steep is the fairly steep slope of D-014? It is assumed at 20 % (about 11 degrees) until the owner gives a number or measures the steepest slope on the land.
    waits_for: owner
    affects:
      - site.grade_max_pct
    opened: 2026-11-03
    phase: design
  - id: Q-009
    kind: question
    text: The rough inputs of step 1.2 (kart mass and its rear share, tyre pressure, track wheel diameter, ski size, drive efficiency, tube lengths, ground clearance, heights of the centres of mass, and a mean speed, rolling resistance, electric efficiency, and usable battery fraction for the run time) are assumed so that forms can be compared. Step 1.3 replaces each with the chosen part's data or a calculation.
    waits_for: assistant
    affects:
      - kart.mass_rough_kg
      - kart.rear_share
      - tyre.pressure_kpa
      - track.wheel_dia_mm
      - ski.width_mm
      - ski.contact_length_mm
      - drive.efficiency
      - frame.tube_25_m
      - frame.tube_32_m
      - kart.clearance_rough_mm
      - kart.axle_part_low_rough_mm
      - kart.cg_height_rough_m
      - seat.above_floor_rough_m
      - rider.cg_above_seat_m
      - kart.wheelbase_rough_mm
      - kart.length_rough_mm
      - rider.cg_above_seat_child_m
      - ground.crr_avg
      - drive.speed_avg_kmh
      - drive.efficiency_electric
      - battery.usable_fraction
    opened: 2026-11-03
    phase: design
  - id: Q-010
    kind: question
    text: The price of the 12 V chargers for E2 and the allowances for shipping, small parts, a reduction stage, skis, the track running gear, pedals and cables and the stop switch, guards and mounts, drive chains, and electric wiring are assumed. Whether the snow chain price of M15 is for one tyre or a pair is not known; two are counted. Step 1.5 replaces each with a quoted price.
    waits_for: assistant
    affects:
      - cost.charger_jpy
      - cost.allow_shipping_jpy
      - cost.allow_small_parts_jpy
      - cost.allow_reduction_jpy
      - cost.allow_skis_jpy
      - cost.allow_track_gear_jpy
      - cost.allow_controls_jpy
      - cost.allow_guards_mounts_jpy
      - cost.allow_drive_chains_jpy
      - cost.allow_electric_jpy
    opened: 2026-11-03
    phase: design
  - id: Q-011
    kind: question
    text: What is the governed no-load speed of the chosen engine? The gearing for R-01 is set to it. It is assumed at 3850 rpm from a checker's recollection (K-001), not from a source; take it from the engine maker's data, or measure it on the engine when it arrives.
    waits_for: assistant
    affects:
      - engine.speed_noload_rpm
      - R-01
    opened: 2026-11-03
    phase: design
  - id: Q-012
    kind: question
    text: How far does the owner's fresh snow give under a loaded plate? A board of known area loaded to about 5 kPa and to about 16 kPa, set on undisturbed fresh snow and its sinkage measured, settles whether rear tracks (W2) clear snow.depth_max_cm before the frame is given mounts for them.
    waits_for: owner
    affects:
      - snow.track_sinkage_max_cm
      - snow.track_sinkage_wheels_cm
      - R-06
    opened: 2026-11-03
    phase: design
  - id: Q-013
    kind: question
    text: Should an adult be able to set a lower top speed for a small child? A 5-year-old drives (D-010), while US youth ATV guidance allows no ATVs under 6 and limits ages 6 and up to 10 mph with the restrictor (P25, S2). The child limit is assumed at 16 km/h, about 10 mph, until the owner decides R-17.
    waits_for: owner
    affects:
      - kart.speed_child_kmh
      - R-17
    opened: 2026-11-03
    phase: design
  - id: Q-014
    kind: question
    text: The 3D simulator needs the tyre grip on pavement, gravel, and grass, the sideways grip of the front skis, the resistance of tracks in fresh snow, and the resistance when the floor ploughs snow. No source was found; they are assumed so that the simulator can run, and a test run of the built kart settles them. Simulator results that rest on them are illustrations, not verification.
    waits_for: assistant
    affects:
      - ground.mu_paved
      - ground.mu_gravel
      - ground.mu_grass
      - ski.mu_lateral
      - track.crr_snow_fresh
      - snow.plough_per_cm
    opened: 2026-11-03
    phase: design
  - id: Q-015
    kind: question
    text: In the owner's Delica D:5, with the third row flipped up and the second row tipped up and slid forward, how wide is the clear space at the floor and at 40 cm above it, and how wide is the tailgate opening at the height of the cargo floor? The sources give only the narrowest and widest widths.
    waits_for: owner
    affects:
      - R-14
    opened: 2026-11-03
    phase: design
