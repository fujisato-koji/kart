kind: open
schema: 1
items:
  - id: Q-001
    kind: question
    text: How heavy is the heaviest adult who will drive? The strength is assumed for 100 kg until the owner answers.
    waits_for: owner
    affects:
      - rider.mass_max_kg
      - R-02
    opened: 2026-11-03
    phase: design
    closed_by: D-009
    closed: 2026-11-03
  - id: Q-002
    kind: question
    text: How tall is the tallest adult who will drive? The youngest is a 5-year-old (D-010); the lower end of the seat and pedal range is set from the statistics of 5-year-olds. The upper end is assumed at 185 cm until the owner answers.
    waits_for: owner
    affects:
      - rider.stature_min_cm
      - rider.stature_max_cm
      - R-03
    opened: 2026-11-03
    phase: design
    closed_by: D-016
    closed: 2026-11-03
  - id: Q-003
    kind: question
    text: Does the top speed of 30 km/h have to be reached on snow, or is a lower speed enough on packed snow and in fresh snow? R-05 and R-06 ask only that the kart runs, turns, and stops on snow.
    waits_for: owner
    affects:
      - R-05
      - R-06
    opened: 2026-11-03
    phase: design
    closed_by: D-011
    closed: 2026-11-03
  - id: Q-004
    kind: question
    text: Set the longest stopping distance from the top speed from a go-kart standard or kart rules. Until then it is assumed at 6 m, about 0.6 g.
    waits_for: assistant
    affects:
      - kart.stop_distance_max_m
      - R-09
    opened: 2026-11-03
    phase: design
  - id: Q-005
    kind: question
    text: Set the smallest ratio of half the track width to the height of the centre of mass, so that the kart slides before it tips, from tyre friction data and any standard. Until then it is assumed at 1.5. Also decide whether R-12 must hold standing sideways on site.grade_max_pct, which needs a wider track (form.track_min_slope_m, check K-001).
    waits_for: assistant
    affects:
      - kart.tip_ratio_min
      - R-12
    opened: 2026-11-03
    phase: design
  - id: Q-006
    kind: question
    text: Where is the kart kept (indoors, under a roof, outdoors), and must it be carried in a car or a truck? This sets the size and mass limits and whether it stands in the cold before a run.
    waits_for: owner
    affects:
      - R-07
    opened: 2026-11-03
    phase: design
    closed_by: D-012
    closed: 2026-11-03
  - id: Q-007
    kind: question
    text: How often is the kart used, and by when should it be ready? The run time is settled by D-013.
    waits_for: owner
    affects:
      - R-08
    opened: 2026-11-03
    phase: design
  - id: Q-008
    kind: question
    text: How steep is the fairly steep slope of D-014? It is assumed at 20 % (about 11 degrees); D-021 lowers it to what the road-legal engine can climb, which is set when the engine is chosen.
    waits_for: owner
    affects:
      - site.grade_max_pct
    opened: 2026-11-03
    phase: design
  - id: Q-009
    kind: question
    text: The rough inputs of step 1.2 (kart mass and its rear share, tyre pressure, track wheel diameter, ski size, drive efficiency, tube lengths, ground clearance, heights of the centres of mass, and a mean speed, rolling resistance, electric efficiency, and usable battery fraction for the run time) are assumed so that forms can be compared. Step 1.3 replaces each with the chosen part's data or a calculation.
    waits_for: assistant
    affects:
      - kart.mass_rough_kg
      - kart.rear_share
      - tyre.pressure_kpa
      - track.wheel_dia_mm
      - ski.width_mm
      - ski.contact_length_mm
      - drive.efficiency
      - frame.tube_25_m
      - frame.tube_32_m
      - kart.clearance_rough_mm
      - kart.axle_part_low_rough_mm
      - kart.cg_height_rough_m
      - seat.above_floor_rough_m
      - rider.cg_above_seat_m
      - kart.wheelbase_rough_mm
      - kart.length_rough_mm
      - rider.cg_above_seat_child_m
      - ground.crr_avg
      - drive.speed_avg_kmh
      - drive.efficiency_electric
      - battery.usable_fraction
    opened: 2026-11-03
    phase: design
  - id: Q-010
    kind: question
    text: The price of the 12 V chargers for E2 and the allowances for shipping, small parts, a reduction stage, skis, the track running gear, pedals and cables and the stop switch, guards and mounts, drive chains, and electric wiring are assumed. Whether the snow chain price of M15 is for one tyre or a pair is not known; two are counted. Step 1.5 replaces each with a quoted price.
    waits_for: assistant
    affects:
      - cost.charger_jpy
      - cost.allow_shipping_jpy
      - cost.allow_small_parts_jpy
      - cost.allow_reduction_jpy
      - cost.allow_skis_jpy
      - cost.allow_track_gear_jpy
      - cost.allow_controls_jpy
      - cost.allow_guards_mounts_jpy
      - cost.allow_drive_chains_jpy
      - cost.allow_electric_jpy
    opened: 2026-11-03
    phase: design
  - id: Q-011
    kind: question
    text: What is the governed no-load speed of the chosen engine? The gearing for R-01 is set to it. It is assumed at 3850 rpm from a checker's recollection (K-001), not from a source; take it from the engine maker's data, or measure it on the engine when it arrives.
    waits_for: assistant
    affects:
      - engine.speed_noload_rpm
      - R-01
    opened: 2026-11-03
    phase: design
  - id: Q-012
    kind: question
    text: How far does the owner's fresh snow give under a loaded plate? A board of known area loaded to about 5 kPa and to about 16 kPa, set on undisturbed fresh snow and its sinkage measured, settles whether rear tracks (W2) clear snow.depth_max_cm before the frame is given mounts for them. A person on snowshoes presses about 3.5 kPa (S4), the same order as a sled bottom (D-023), so the depth a snowshoe sinks in the deepest fresh snow is a first measure of whether the snowmobile form floats.
    waits_for: owner
    affects:
      - snow.track_sinkage_max_cm
      - snow.track_sinkage_wheels_cm
      - R-06
    opened: 2026-11-03
    phase: design
  - id: Q-013
    kind: question
    text: Should an adult be able to set a lower top speed for a small child? A 5-year-old drives (D-010), while US youth ATV guidance allows no ATVs under 6 and limits ages 6 and up to 10 mph with the restrictor (P25, S2). The child limit is assumed at 16 km/h, about 10 mph, until the owner decides R-17.
    waits_for: owner
    affects:
      - R-17
    opened: 2026-11-03
    phase: design
    closed_by: D-018
    closed: 2026-11-04
  - id: Q-014
    kind: question
    text: The 3D simulator needs the tyre grip on pavement, gravel, and grass, the sideways grip of the front skis, the resistance of tracks in fresh snow, and the resistance when the floor ploughs snow. No source was found; they are assumed so that the simulator can run, and a test run of the built kart settles them. Simulator results that rest on them are illustrations, not verification.
    waits_for: assistant
    affects:
      - ground.mu_paved
      - ground.mu_gravel
      - ground.mu_grass
      - ski.mu_lateral
      - track.crr_snow_fresh
      - snow.plough_per_cm
    opened: 2026-11-03
    phase: design
  - id: Q-015
    kind: question
    text: In the owner's Delica D:5, with the third row flipped up and the second row tipped up and slid forward, how wide is the clear space at the floor and at 40 cm above it, and how wide is the tailgate opening at the height of the cargo floor? The sources give only the narrowest and widest widths.
    waits_for: owner
    affects:
      - R-14
    opened: 2026-11-03
    phase: design
  - id: Q-016
    kind: question
    text: How many hours a day can the owner work on the kart? The plan in docs/data/plan.yaml assumes two to three hours a day for its task lengths.
    waits_for: owner
    affects:
      - R-08
    opened: 2026-11-03
    phase: design
  - id: Q-017
    kind: question
    text: Step 1.3 assumes, without a source yet, the dynamic load factor on the frame and axle, the density and strength of S45C and STKM11A steel, the masses of a wheel with its tyre, the clutch, the seat, the steering, the brake, the fuel, and small parts, the brake pad friction, and the ratio of buttock-to-heel length to stature for an adult and for a 5-year-old. Cite a standard, a maker's data, or a weighing for each before the gate from design to build.
    waits_for: assistant
    affects:
      - dsn.steel_density_kg_m3
      - dsn.s45c_yield_mpa
      - dsn.stkm11a_tensile_mpa
      - dsn.wheel_mass_kg
      - dsn.clutch_mass_kg
      - dsn.seat_mass_kg
      - dsn.steering_mass_kg
      - dsn.brake_mass_kg
      - dsn.misc_mass_kg
      - dsn.fuel_mass_kg
      - dsn.pad_mu
      - dsn.buttock_heel_ratio_adult
      - dsn.buttock_heel_ratio_child
    opened: 2026-11-03
    phase: design
    blocks: design_build
  - id: Q-018
    kind: question
    text: The parts list assumes the price of steel plate cut to size, of machining by a local shop (keyways on the axle and the jackshaft, boring the 36 tooth sprocket, cross holes for the hub pins, the brake disc carrier), of making the two rear hubs, and of a 25 mm axle shaft of 1.22 m. Get quotes before the gate from design to build.
    waits_for: assistant
    affects:
      - cost.plate_allow_jpy
      - cost.machining_allow_jpy
      - cost.rear_hub_make_jpy
      - cost.axle_shaft_jpy
      - cost.tube_32x23_jpy_per_m
      - cost.hand_brake_jpy
    opened: 2026-11-03
    phase: design
    blocks: design_build
  - id: Q-019
    kind: question
    text: The fit of bought parts to each other is not stated by their sellers and is checked when they arrive, before the frame is welded to them - the rim's three-hole pattern against the front hubs and the made rear hubs, the front hubs' bore against the 17 mm spindles, the engine's shaft (3/4 inch Q-type) and base holes, and the seat's rail bolt spacing.
    waits_for: assistant
    affects:
      - front_wheels
      - rear_hubs
      - engine
      - seat
    opened: 2026-11-03
    phase: build
    blocks: design_build
  - id: Q-020
    kind: finding
    text: The layout of step 1.3 is not yet buildable (K-005). Rearrange the drive so that the chains, the jackshaft and its bearings, the middle axle bearing, and the guard fit between the seat and the left rail, or move the drive outboard; redesign the column support so it holds the column at its lower flange bearing and clears the legs; route the pedal box rails clear of the cross members; raise the steering arms and tie rods clear of the front rails; join every plate, the floor, and the seat slide to the frame; widen the seat space; and add the cornering side force to the axle and the engine's offset to the left rail.
    waits_for: assistant
    affects:
      - frame
      - chain_final
      - axle_bearings
      - guards
      - tie_rods
      - seat
    opened: 2026-11-03
    raised_by: assistant
    phase: design
    blocks: design_build
    closed_by: D-030
    closed: 2026-11-04

  - id: Q-021
    kind: question
    text: Which class of vehicle the kart becomes on public roads (most likely a minicar, a four-wheel first-class moped with up to 50 cc or 0.6 kW rated electric output), and which safety standards (brakes, lamps, turn signals, mirrors, horn, speedometer, plate, size), registration steps, tax, and insurance apply; list each as a requirement with its article from the law.
    waits_for: assistant
    affects:
      - R-18
    opened: 2026-11-04
    phase: design
    blocks: design_build
  - id: Q-022
    kind: question
    text: How does the owner's municipality register a minicar built from scratch - how is a frame number given to a home-made frame, and which papers prove the engine's displacement (the donor's scrapping certificate, a receipt or transfer certificate, an engine-number rubbing)? No official page found covers a scratch-built frame; the owner asks the municipality's light vehicle tax counter.
    waits_for: owner
    affects:
      - R-18
    opened: 2026-11-04
    phase: design
    blocks: design_build
  - id: Q-023
    kind: question
    text: The size and mass of a 50 cc scooter's engine and transmission unit, its final reduction, and its ECU's rev limit are not stated in any source found; the design assumes them. Measure the donor unit when it arrives, and set the drive sprockets so the top speed at the rev limit is kart.speed_max_kmh.
    waits_for: assistant
    affects:
      - su.length_mm
      - su.width_mm
      - su.height_mm
      - su.mass_kg
      - su.final_ratio
      - su.rev_limit_rpm
      - su.clutch_lock_rpm
      - dsn.road_kit_mass_kg
    opened: 2026-11-04
    phase: design
    blocks: design_build
  - id: Q-024
    kind: question
    text: No seat belt marked JIS D4604, which the safety standards accept (P36 article 66-2), was found for sale to individuals; generic belts (M78) are not marked. A belt with its anchors from a scrapped kei car carries its approval; find one and its price, and check how it mounts on the kart's frame and seat.
    waits_for: assistant
    affects:
      - cost.belt_used_car_jpy
      - R-22
    opened: 2026-11-04
    phase: design
    blocks: design_build
  - id: Q-025
    kind: finding
    text: The road-going layout is not yet buildable (K-006). Move the left side bar and the column braces clear of the scooter unit and the adult's shins; give the unit a plate on both rails; keep the axle sprocket and chain clear of the middle bearing plate; raise the roll bar above the tallest driver's head with a folding or bolted top for the car, with a front structure for a rollover; mount the hand brake, belt anchors, head restraint, battery, horn, and mirrors (facing the driver) on the frame; place the fuel tank, ECU, regulator, key switch, and the donor's silencer; add the cornering load to the axle and check a 30 mm axle; and carry the engine unit's mass on both rails. Build the collision search into calc/design.py so each change is checked.
    waits_for: assistant
    affects:
      - frame
      - roll_bar
      - engine
      - hand_brake
      - mirrors
      - axle_shaft
    opened: 2026-11-04
    raised_by: assistant
    phase: design
    blocks: design_build
    closed_by: D-030
    closed: 2026-11-04

  - id: Q-026
    kind: question
    text: The owner described the kart as like a kick scooter for the far outdoors (D-023). Does that ask for a standing ride, or for a light personal vehicle that is still seated? A standing ride conflicts with the seat, seat belt, and head restraint the law asks of a minicar on roads (R-22), and with a child driving.
    waits_for: owner
    affects:
      - D-023
      - R-22
    opened: 2026-11-04
    phase: design
    closed_by: D-026
    closed: 2026-11-04
  - id: Q-027
    kind: question
    text: The rough inputs of the snowmobile form and the hull - the track's place and mass (its size is a Yamaha Bravo's, P51), the parts removed and added at each change, the drive sprocket, the hull's size, foam share, and plating, the water design points, the outboard's battery, and the change time - are assumed until a donor is chosen and the hull is laid out in step 1.3.
    waits_for: assistant
    affects:
      - sm.track_x_mm
      - sm.track_unit_kg
      - sm.removed_kg
      - ski.pair_kg
      - sm.drive_dia_mm
      - sm.speed_snow_kmh
      - hull.length_mm
      - hull.beam_mm
      - hull.depth_mm
      - hull.bottom_clear_mm
      - hull.foam_share_max
      - hull.bottom_t_mm
      - hull.side_t_mm
      - hull.sheet_density_kg_m3
      - cost.allow_winter_mounts_jpy
      - w4.wheel_share
      - w4.big_tyre_dia_mm
      - w4.big_tyre_width_mm
      - outboard.battery_kg
      - cost.allow_outboard_battery_jpy
      - water.freeboard_min_mm
      - water.speed_min_kmh
      - water.shore_grade_pct
      - water.reserve_ratio
      - kart.swap_time_h
    opened: 2026-11-04
    phase: design
  - id: Q-028
    kind: question
    text: A kart that moves on a lake is an amphibious vessel, a special ship, which the small-boat exemption from ship inspection does not cover (P46). Ask the regional transport bureau whether a home-built amphibious kart moved on water only by an electric outboard under 1.5 kW, with its engine stopped, can be inspected; whether a tub that the persons formula rates for nobody may be approved on an inclining test, or needs side floats for water days; whether the 50 cc engine counts as propulsion because it can turn the wheels in water; and whether a pond on private land is outside the Ship Safety Act (only named waters are exempt from registration, P58). What an inspection asks and costs is in docs/02-form.md#water (P55, P56). No official page on a small amphibious vessel was found.
    waits_for: owner
    affects:
      - R-27
    opened: 2026-11-04
    phase: design
    closed_by: D-027
    closed: 2026-11-04
  - id: Q-029
    kind: question
    text: (W3, given up for W6 by D-032; its part left the record.) The donor's track unit is drawn from assumed sizes - the track's thickness with its lugs, the rear idler's diameter, the drive shaft's height and its place ahead of the slide rails - which set the winter lift. Measure them on the donor (a Yamaha Bravo class) when it is bought, with its mass and mounting points, and check that a pivot shaft through the pillow blocks and brackets hanging from the rails can hold it.
    waits_for: assistant
    affects:
      - sm.track_t_mm
      - sm.idler_dia_mm
      - sm.drive_z_mm
      - sm.drive_ahead_mm
      - sm.lift_mm
    opened: 2026-11-04
    phase: design
  - id: Q-030
    kind: question
    text: The sled pan held 0.020 m3 of foam, which floated 0.15 of the winter kart's own weight, while R-29 asked water.reserve_ratio, which needed about 0.158 m3. The room is not there without bolting large floats on. With boat use withdrawn (D-027), should R-29 keep only the driver's part (a life jacket and no seat belt on ice, nothing holding the driver) and drop the kart's floating, or should the kart carry floats in winter?
    waits_for: owner
    affects:
      - R-29
    opened: 2026-11-04
    phase: design
    closed_by: D-028
    closed: 2026-11-04
  - id: Q-031
    kind: question
    text: The rough inputs of 1.2.17 - the track's own resistance on packed snow, and the wheel size under a snowblower crawler - are assumed until the donor's track is run on packed snow and the roll bar is laid out.
    waits_for: assistant
    affects:
      - track.crr_snow_packed
      - sm.crawler_wheel_dia_mm
    opened: 2026-11-04
    phase: design
  - id: Q-032
    kind: question
    text: With the straddle layout of D-030, set the stability margin that R-12 asks for a kart ridden actively, and the protection R-19 asks if it tips or rolls; and confirm which of R-22 (seat belt and head restraint) and R-24 (the 1 m marker) still apply to a straddled seat of at least 500 mm, which P36 exempts.
    waits_for: assistant
    affects:
      - R-12
      - R-19
      - R-22
      - R-24
      - kart.tip_ratio_min
    opened: 2026-11-04
    phase: design
  - id: Q-033
    kind: question
    text: The straddle kart of 1.2.18 is sized from assumed numbers - its seat and footrest heights, track, wheelbase, overhangs, mass and centre of mass, fender margin, and a 6-year-old's crotch height as a share of stature (no Japanese data for that age was found) - until it is laid out in 1.3.
    waits_for: assistant
    affects:
      - st.seat_height_mm
      - st.footrest_height_mm
      - st.track_mm
      - st.wheelbase_mm
      - st.overhang_mm
      - st.kart_mass_kg
      - st.kart_cg_mm
      - st.kart_cg_x_share
      - st.fender_mm
      - dsn.fender_mass_kg
      - rider.child_crotch_ratio
    opened: 2026-11-04
    phase: design
  - id: Q-034
    kind: question
    text: The winter form W5 (dropped for W6 by D-032) assumes large low-pressure tyres of the 25x12-9 class with rims, their mass and price, and a 12T output and 45T axle sprocket and their price, until a tyre that fits the rear hubs is chosen.
    waits_for: assistant
    affects:
      - w5.tyre_dia_mm
      - w5.tyre_width_mm
      - w5.wheel_mass_kg
      - w5.axle_teeth
      - w5.out_teeth
      - cost.w5_wheel_jpy
      - cost.spr420_45t_jpy
    opened: 2026-11-04
    phase: design
  - id: Q-035
    kind: finding
    text: The straddle kart of 1.3 is placed by hand and has had no collision search. K-013 left the spine too weak (a truss under the seat or a larger tube), the tie rods 4 mm from the front rails, the footboards held at one edge, the axle sprocket and axle uncovered, and the battery and the stem's foot without supports. The next pass builds a collision search into calc/design.py for the summer and winter forms and resolves these.
    waits_for: assistant
    affects:
      - frame
      - engine
      - handlebar
      - footrests
    opened: 2026-11-04
    raised_by: assistant
    phase: design
    closed: 2026-11-04
    closed_by: D-037
    blocks: design_build
  - id: Q-036
    kind: question
    text: The buggy-size tyres of 1.2.19 (about 19x7-8 at the front and 18x9.5-8 at the rear, as on the MAGMAX50 of M90) are taken at a common diameter, their widths and mass, with the chains for them and the 42T axle sprocket the larger tyres need, until a set that fits the hubs and the road rules is chosen; a set of four is priced in M96.
    waits_for: assistant
    affects:
      - yr.tyre_dia_mm
      - yr.rear_width_mm
      - yr.front_width_mm
      - yr.wheel_mass_kg
      - w6.chain_mass_kg
      - cost.spr420_42t_jpy
    opened: 2026-11-04
    phase: design
  - id: Q-037
    kind: question
    text: The cheaper parts of D-033 are taken from shop listings that leave their fit unstated - whether the ATV knuckles (M92) turn on kingpins as 1.3.6 draws them or need two ball joints on brackets; whether the drum hubs (M93) come with shoes and a backing plate, their drum size, and whether their three studs on 78 mm match the wheels (M96 gives PCD 110, or 88 at the front); the cable and splitter from the left lever; whether the LCD meter (M94) is lit at night and how its sensor reads the wheel; the fenders' width (M95); and the cost of making the ski brackets. They are settled before the parts are ordered, and checked on arrival as Q-019 says.
    waits_for: assistant
    affects:
      - lay.front_drum_dia_mm
      - cost.front_drum_allow_jpy
      - cost.ski_bracket_make_jpy
      - cost.atv_drum_hub_jpy
      - cost.atv_wheels_set_jpy
      - cost.lcd_meter_jpy
    opened: 2026-11-04
    phase: design
  - id: Q-038
    kind: question
    text: The owner asked whether the wheels should follow the ground on springs. The kart of 1.3 is rigid and rides on its low-pressure tyres alone, as small karts and the cheapest youth quads do, while road-registered 50 cc ATVs have shocks front and rear (M97). Springs would keep the tyres pressing on rough ground for steering and braking, cut the shock loads on the spine that Q-035 already finds weak, and spare the rider. The candidates are a rear swing arm with one shock carrying the axle, pivoted at the engine unit's output so that the chain keeps its length; ATV A-arms with shocks at the front; and a front beam pivoting on the centre line, which is cheap but tips sideways like the one front wheel of 1.2.19 unless stopped. Studied with the frame in the pass of Q-035.
    waits_for: assistant
    affects:
      - frame
      - rear_axle
      - spindles
    opened: 2026-11-04
    raised_by: owner
    phase: design
    closed: 2026-11-04
    closed_by: D-036
  - id: Q-039
    kind: question
    text: The frame pass of D-036 and D-037 assumes the UCP207 pillow block's sizes, mass, and price for the 35 mm axle (the common sizes of the series; check them against the FYH catalogue P33 when bought), the rear shock's stroke (its seller states the eye-to-eye length only, M100), and a rear natural frequency of 2.5 Hz for a short-travel kart, until the shock is bought, measured, and its spring chosen.
    waits_for: assistant
    affects:
      - brg.ucp207_h_mm
      - brg.ucp207_l_mm
      - brg.ucp207_h2_mm
      - brg.ucp207_mass_kg
      - cost.ucp207_jpy
      - shock.stroke_mm
      - sus.freq_hz
    opened: 2026-11-04
    phase: design
  - id: Q-040
    kind: question
    text: The load cases for rough ground of 1.3.18 assume what no source gives for this kart - the combination of 2 g vertical with 1 g braking and 1 g sideways, a frontal impact of 5 g at 30 km/h against a post or tree that misses the tyres (Baja's frontal 8 to 10 g at 56 km/h scaled with the same impulse time gives 4.3 to 5.4 g, P74, P75), a sideways push on the hoop of the kart's weight, both hoop loads applied with the frame held at its spine and the rider's mass left out (as rollover structures are tested; held at the hoop with the kart's masses pushing, the side push would be worse), a safety factor of 1 on tensile strength in accidents, a usable tyre deflection of 50 mm and a reference drop of 150 mm, a repeated load range of 1 g with a partial factor of 1.35 for fatigue, and the detail categories of butt-welded tubes and plates standing for the frame's tube-to-tube joints, which EN 1993-1-9 does not list. The frame is to last 2 million such ranges at those details, as many kilometres of rough ground at one such bump a metre. They hold until the kart is measured on its ground.
    waits_for: assistant
    affects:
      - load.combined_vert_g
      - load.combined_brake_g
      - load.combined_lat_g
      - load.impact_g
      - load.hoop_side_g
      - load.accident_safety_min
      - land.tyre_defl_mm
      - land.drop_ref_mm
      - fat.gamma_mf
      - fat.range_g
      - fat.life_kcycles_min
    opened: 2026-11-04
    phase: design
  - id: Q-041
    kind: finding
    text: Against the load cases for rough ground of 1.3.18 the frame's welded joints have a limited fatigue life - a repeated 1 g range is unlimited only below about 0.7 g at butt-welded details and 0.4 g at fillet-welded ones. (The spine, the axle, the bumper, and the hoop, which fell short at first, were changed with D-038 and now meet their cases.) The joints are to be detailed with gussets and fitted ends for the better categories before building, and the frame tried on its ground.
    waits_for: assistant
    affects:
      - frame
      - bumpers
      - roll_bar
      - axle_shaft
    opened: 2026-11-04
    raised_by: assistant
    phase: design
    closed: 2026-11-04
    closed_by: D-040
    blocks: design_build
  - id: Q-042
    kind: question
    text: For rough ground the owner decides the front's springing of 1.3.18 (the ride height of 1.3.19 is settled by D-038) - stay rigid and ride drops of more than a few centimetres slowly, or add ATV A-arms with two shocks (D-036 put this off; a kit costs about 70,000 to 73,000 JPY, M104).
    waits_for: owner
    affects:
      - spindles
    opened: 2026-11-04
    raised_by: assistant
    phase: design
    closed: 2026-11-04
    closed_by: D-039
  - id: Q-043
    kind: question
    text: The front end of 1.3 grew by patching interferences and passed its checks without being a sound structure - the steering did not visibly reach the wheels, the springs' action was unclear, and the stem's stays carried little. 1.2.20 sets the front end's requirements, gathers precedents, and compares four forms - double A-arms, one arm a side on a fore-and-aft axis, a leading arm a side, and a rigid beam - by their load paths and by how camber, toe, and caster change over the travel; the owner chooses the form before the front end is designed again.
    waits_for: owner
    affects:
      - front_arms
      - front_shocks
      - spindles
      - handlebar
      - frame
    opened: 2026-11-04
    raised_by: owner
    phase: design
    closed_by: D-041
    closed: 2026-11-04
  - id: Q-044
    kind: finding
    text: The double A-arms of D-041 (1.3.20) rest on hard points set before the knuckles were measured. Whether the bought knuckles (M92) take ball joints or a kingpin between the arms, where their joints and steering arm are, and how long that arm is (lay.steer_arm_mm, assumed) are to be measured on the parts in hand, and the hard points set from them, before the arms are made; the ball joints in the parts list (M106) stand for either. The front steers with more Ackermann than one turning centre needs - the outer wheel turns dsn.steer_outer_deg where dsn.steer_outer_ideal_deg would do - because arms angled to correct it raise the toe change to dsn.bump_steer_alt_deg. The tyre stands within 5 mm of the lower arm's outer end. From land.drop_ref_mm the front lands at dsn.landing_front_g, above the bump case (FE-04); the arms would allow more travel, as far as the shocks' stroke does. The arms' pivot bolts and bushes are not yet priced.
    waits_for: owner
    affects:
      - front_arms
      - spindles
      - tie_rods
    opened: 2026-11-05
    raised_by: assistant
    phase: design
