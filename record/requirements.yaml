kind: requirement
schema: 1
items:
  - id: R-01
    text: The kart is not faster than its set top speed.
    origin: owner
    design_point: Top speed on level paved ground, with the lightest and with the heaviest rider, is at most kart.speed_max_kmh.
    verify: test
    basis:
      - D-020
      - D-011
    status: confirmed
  - id: R-02
    text: The kart carries an adult.
    origin: owner
    design_point: Frame, axles, steering, seat, and their joints carry a rider of rider.mass_max_kg under the load cases of docs/03-design.md without yield or loosening.
    verify: analysis
    basis:
      - D-004
    status: confirmed
  - id: R-03
    text: The seat, footrests, and handlebar fit riders from a 6-year-old child to an adult.
    origin: owner
    design_point: Without welding or cutting - the child's steps bolt on - riders from rider.stature_min_cm to rider.stature_max_cm sit astride with both feet on the footboards or the steps, hold the grips with bent arms, and, standing on the footrests, clear the seat by at least rider.child_fit_clear_mm.
    verify: demonstration
    basis:
      - D-004
      - D-035
    status: confirmed
  - id: R-04
    text: The kart runs on paved ground, gravel or dirt, and grass.
    origin: owner
    design_point: With the heaviest rider, on each of the three surfaces, the kart starts from rest, runs, turns, and stops, climbs site.grade_max_pct, and no part other than the tyres touches the ground.
    verify: test
    basis:
      - D-005
    status: confirmed
  - id: R-05
    text: The kart runs on packed snow and ice.
    origin: owner
    design_point: With the heaviest rider, on level packed snow, the kart starts from rest, runs, turns, and stops, at any speed.
    verify: test
    basis:
      - D-006
      - D-011
      - D-023
    status: confirmed
  - id: R-06
    text: The kart runs in fresh snow.
    origin: owner
    design_point: With the heaviest rider, on level fresh snow of depth snow.depth_max_cm, the kart starts from rest, runs, and turns at any speed without getting stuck.
    verify: test
    basis:
      - D-006
      - D-011
    status: confirmed
  - id: R-07
    text: The kart works in the cold.
    origin: owner
    design_point: After standing outdoors at ambient.temp_min_c, the kart starts and runs. With batteries it runs for kart.run_time_min per charge; with an engine it may be refuelled between runs.
    verify: test
    basis:
      - D-007
      - D-013
    status: confirmed
  - id: R-08
    text: The kart is built within the budget.
    origin: owner
    design_point: The parts list of docs/05-parts-and-cost.md, with tax, shipping, and winter parts, totals at most budget.parts_jpy, or the owner has accepted the excess.
    verify: inspection
    basis:
      - D-008
    status: confirmed
  - id: R-09
    text: The kart stops in a short distance.
    origin: derived
    design_point: With the heaviest rider, from kart.speed_max_kmh on level dry paved ground, the kart stops within kart.stop_distance_max_m.
    verify: test
    basis:
      - H-01
      - H-07
    status: awaiting
  - id: R-10
    text: The drive stops when the driver lets go.
    origin: derived
    design_point: The throttle returns to zero by a spring when released, and a stop switch that the driver reaches from the seat, and a helper reaches from beside the kart, cuts the drive.
    verify: demonstration
    basis:
      - H-02
    status: awaiting
  - id: R-11
    text: Moving and hot parts cannot be touched.
    origin: derived
    design_point: Chain, sprockets, belt, the turning axle near the seat, and any hot part are covered so that the driver's hands, feet, hair, and clothing cannot reach them from the seat.
    verify: inspection
    basis:
      - H-03
      - H-04
    status: awaiting
  - id: R-12
    text: The kart slides before it tips over.
    origin: derived
    design_point: With the heaviest rider, half the track width divided by the height of the centre of mass is at least kart.tip_ratio_min on wheels and on skis with chains; in the snowmobile form, which runs only on snow, the distance from the centre of mass to the tipping edge divided by its height is at least kart.tip_ratio_snow_min.
    verify: analysis
    basis:
      - H-05
      - D-025
    status: confirmed
  - id: R-13
    text: The frame shields the driver's legs and feet.
    origin: derived
    design_point: Seen from the front and the sides, the driver's feet and legs are inside the frame or a bumper.
    verify: inspection
    basis:
      - H-01
    status: awaiting
  - id: R-14
    text: The kart is carried in a Mitsubishi Delica D:5.
    origin: owner
    design_point: With the rear seats of a Delica D:5 folded and slid forward, the kart passes through the tailgate opening (delica.opening_width_min_mm to delica.opening_width_max_mm wide) and lies within the cargo space (delica.cargo_length_mm long, delica.cargo_width_min_mm between the flipped-up third-row seats, delica.cargo_width_max_mm at most), after removing at most parts that come off without tools.
    verify: demonstration
    basis:
      - D-012
    status: confirmed
  - id: R-15
    text: One adult loads and unloads the kart alone.
    origin: derived
    design_point: One adult rolls the kart up a ramp onto the cargo floor at delica.lip_height_mm and back down, without lifting the whole kart.
    verify: demonstration
    basis:
      - D-012
      - H-09
    status: awaiting
  - id: R-16
    text: The kart climbs a fairly steep slope slowly without damage.
    origin: owner
    design_point: With the heaviest rider, on grass at site.grade_max_pct, the kart starts from rest on the slope and climbs at walking pace or faster, and no part slips, overheats, or deforms.
    verify: test
    basis:
      - D-014
      - D-021
    status: confirmed
  - id: R-17
    text: An adult can set a lower top speed for a small child.
    origin: derived
    design_point: Without tools, an adult sets the top speed on level paved ground to at most kart.speed_child_kmh, and the child cannot undo the setting from the seat.
    verify: demonstration
    basis:
      - H-08
      - D-018
    status: withdrawn
  - id: R-18
    text: The kart may be driven on public roads.
    origin: owner
    design_point: The kart meets every safety standard and registration rule that applies to its class of vehicle, listed from the law in step 1.1 (Q-021), and is registered with its number plate and compulsory insurance before it is driven on a road.
    verify: inspection
    basis:
      - D-019
    status: confirmed
  - id: R-19
    text: A belted driver is protected if the kart rolls over.
    origin: derived
    design_point: A roll bar rises above the head of the tallest driver (rider.stature_max_cm) seated, and carries the kart's weight upside down without collapsing onto the driver.
    verify: analysis
    basis:
      - H-05
      - D-022
    status: awaiting
  - id: R-20
    text: The kart has the lamps and reflectors of a moped.
    origin: derived
    design_point: A white head lamp that dips, a red tail lamp, a red stop lamp, a number plate lamp, a red rear reflector, and amber turn signals at the front and the rear on both sides, as P36 articles 62 to 64-3 ask.
    verify: inspection
    basis:
      - R-18
    status: awaiting
    parent: R-18
  - id: R-21
    text: The kart has two independent brake systems and a parking brake.
    origin: derived
    design_point: A foot brake on the rear wheels and a separate hand brake, either of which stops the kart, and a parking brake that holds it on law.parking_grade_pct (P36 article 61, P37).
    verify: test
    basis:
      - R-18
    status: awaiting
    parent: R-18
  - id: R-22
    text: The driver's seat has a seat belt and a head restraint.
    origin: derived
    design_point: A seat belt with anchors on the frame and a head restraint behind the driver's head, as P36 articles 66-2 and 66-3 ask for a seat that is not straddled.
    verify: inspection
    basis:
      - R-18
      - D-030
      - P70
    status: withdrawn
    parent: R-18
  - id: R-23
    text: The kart has a mirror, a horn, a speedometer, and an approved silencer.
    origin: derived
    design_point: An adjustable mirror on each side, a horn, a lit speedometer with an odometer in the driver's view, and the engine's own approved silencer (P36 articles 64, 64-2, 65, 65-2).
    verify: inspection
    basis:
      - R-18
    status: awaiting
    parent: R-18
  - id: R-24
    text: Other road users can see the low kart.
    origin: derived
    design_point: A structure at least law.marker_height_mm above the ground (P36 article 61-2), which the roll bar provides.
    verify: inspection
    basis:
      - R-18
      - D-030
      - P70
    status: withdrawn
    parent: R-18
  - id: R-25
    text: The kart is within the size of a moped.
    origin: derived
    design_point: Overall length at most law.length_max_mm and width at most law.width_max_mm (P36 article 59).
    verify: inspection
    basis:
      - R-18
    status: awaiting
    parent: R-18
  - id: R-26
    text: The engine is within the moped limit.
    origin: derived
    design_point: Displacement at most law.minicar_cc_max (P35).
    verify: inspection
    basis:
      - R-18
    status: awaiting
    parent: R-18
  - id: R-27
    text: The kart goes into calm water from a shore, floats and moves on it, and drives out again.
    origin: owner
    design_point: With the heaviest rider, in calm fresh water, the kart floats upright with a freeboard of at least water.freeboard_min_mm, moves at water.speed_min_kmh or more and steers, and drives out up a shore of water.shore_grade_pct.
    verify: test
    basis:
      - D-024
      - D-027
    status: withdrawn
  - id: R-28
    text: The kart changes between a summer form on tyres and a winter form on skis and a track.
    origin: derived
    design_point: Two people change the kart from one form to the other with hand tools in at most kart.swap_time_h, without cutting or welding.
    verify: test
    basis:
      - D-023
      - D-025
    status: confirmed
  - id: R-29
    text: A driver whose kart capsizes or swamps in water, or breaks through ice, gets free and stays afloat.
    origin: derived
    design_point: On ice and near water the driver wears a life jacket and no seat belt, and nothing of the kart holds a driver in it when it rolls or goes through the ice - the driver gets out sideways under the roll bar without help. The kart itself need not float.
    verify: analysis
    basis:
      - H-11
      - D-028
    status: confirmed
  - id: R-30
    text: The tyres do not stick out past the body.
    origin: derived
    design_point: Seen from above, fenders or the body cover the tyres' full width, as the safety standards ask of three- and four-wheel mopeds (P70).
    verify: inspection
    basis:
      - R-18
    status: awaiting
    parent: R-18
  - id: R-31
    text: Riders wear protective gear.
    origin: derived
    design_point: Every rider wears a motorcycle helmet, eye protection, gloves, over-the-ankle boots, and long trousers and sleeves, as youth ATV guidance asks (P69); the law asks no helmet of a minicar (P70), so this is the kart's own rule.
    verify: inspection
    basis:
      - H-05
      - D-030
    status: awaiting
