    detail: An independent helper re-solved the frame of form A against the frame before it, recounted the tubes as cut and their welded ends on its own, ran the interference search with and without the joints' spheres and with every rule switched off, ran the old and new rules on both frames, and ran the 3D view's count of welded ends against the design's. It confirmed the counts, that nothing clashes but the known front tyre (Q-044), that the new rules hide nothing and wrongly flag nothing, and that the 3D view marks the same welded ends. It refuted - that every safety factor stayed or rose (the driving one fell from 2.33 to 2.32); the box's open bay at 51 MPa, summed over a tube gone and without the one now closing it (about 61); that the tubes taken out all carried little (the seat rails' rear cross tube took 82 MPa when the hoop is pushed sideways, and without the box's rear top cross tube and the tubes down from the seat rails the range at the box's rear uprights' joints rose from about 20 to 34 MPa, over category 45's limit); the pivot tube's free ends counted as welded; and stale text - the requirements' measures showing the new frame's numbers, and the truss of D-040 said to be gone. All were corrected the same day - the tubes from the seat rails down to the spine stay, which brings the range back to about 20 MPa with the rear top cross tube still out; the bay is summed over the tubes that close it; the pivot tube's ends are free in the count (154 before, 134 now); and the text gives the numbers as they are.
