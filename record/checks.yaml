    detail: An independent helper recomputed the stop's angles by bisection and as the common tangent of the tyre and the wheel, rederived the front's lift under power, rebuilt the stop's load case with other supports, ran the interference search with and without the joints' spheres, measured the feet at full lock, and compared the before-and-after table with main. It confirmed the touch angle (25.3 degrees), the departure angle (20.1), the front's lift at 40.2 degrees standing, the table, the adult's heel 88 mm back, the feet clear of the front tyres at full lock (14 mm), and nothing on the stop within 5 mm of anything. It refuted - the load case, held at a node joined to nothing, a mechanism whose 77 MPa came from the solver's small springs (the arm's rear end governs, at about 285 MPa); the slope up to which the kart falls back onto its front wheels (about 15 degrees, not 25, which is where it goes over); the whole kart turned with the frame as the safe side (the arm's masses turn forward); the stop keeping its height as the arm moves (41 to 122 mm); the wheel's rating (about 2.2 kN sitting on the stop against 1.2 kN for a caster of that size); the claim that the tyres' grip cannot lift the front, which on dry pavement it can when braking while rolling back; and the child's fit unchanged (the heel comes 80 mm back). It also found the stem's upper bearing cutting 18 mm into the nose box's top cross tube, hidden by a joint's sphere, and the rear brake alone only just holding downhill. All were corrected the same day - the case lies on the stop with determinate supports and every mass, and the solver stops on a mechanism; the slopes, the height, the child, and the pavement case are stated; a wheel rated 5.1 kN; the top cross tube stands where the stem's bearing clears it, the shocks on lugs behind it; the brake is in the table.
