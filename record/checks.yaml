kind: check
schema: 1
items:
  - id: K-001
    target:
      - snow.wheel_sinkage_max_cm
      - snow.wheel_depth_limit_cm
      - snow.track_sinkage_max_cm
      - drive.engine_thrust_n
      - drive.motor_thrust_n
      - drive.motor2_thrust_n
      - drive.sprocket_reach_mm
      - form.track_min_m
      - cost.total_l2_e1_w1_jpy
      - cost.total_l2_e1_w2_jpy
    tier: T2
    method: refute
    result: partial
    by: assistant
    date: 2026-11-03
    detail: An independent helper recomputed every claim by hand and then read calc/form_rough.py; the arithmetic held, the method did not in places. Found (1) P1's pmax is the contact pressure, not the inflation pressure, which does not change the conclusion; the sinkage exceeds the tyre radius, and the lowest part is the axle hardware, not the floor. (2) Tracks without road wheels carry the load under the sprocket and idler, so the even-belt pressure understates their sinkage; W2 passing R-06 was not shown, and P1 excludes tracked vehicles. (3) The climb needs rolling resistance on grass and gravel; a motor's force is limited by its controller current; 3600 rpm is P4's rated speed, not the governed no-load speed, so gearing to it may break R-01. (4) Whole teeth and tooth tips put the single-stage sprocket lower still. (5) The track width was rounded down, and R-12 on level ground does not cover the slope sideways. (6) Pedals, cables, stop switch, drive chains, guards, mounts, and electric wiring were missing from the cost, and two snow chains may be counted where one pair was priced. The script and record were changed on each point on the same day; see docs/02-form.md.
  - id: K-002
    target:
      - snow.track_sinkage_wheels_cm
      - snow.wheel_depth_limit_cm
      - snow.wheel_depth_limit_axle_cm
      - form.track_min_m
      - form.track_min_slope_m
      - drive.engine_thrust_n
      - drive.motor_thrust_n
      - drive.motor2_thrust_n
      - drive.climb_force_n
      - drive.sprocket_reach_mm
      - cost.total_l2_e1_w1_jpy
      - cost.total_l2_e1_w2_jpy
    tier: T2
    method: refute
    result: partial
    by: assistant
    date: 2026-11-03
    detail: A second independent helper rechecked the repairs of K-001 by hand; all seven figures reproduce, and the script matches the record. Partial on the motors - the 2 kW kit's torque, speed, and current disagree (its rated current is probably the controller's rating), the text wrongly said the electric kits climb on pavement, and whether the controllers limit battery or motor current is not assessed. Also noted - the track wheel relation is used beyond its small-sinkage range, tracks on smaller wheels lower the rear axle, E1h has the same margin as E1, and the gearing limits speed only on level ground and uphill. The text of docs/02-form.md was corrected on each point the same day; no number changed.
  - id: K-003
    target:
      - drive.engine_thrust_n
      - drive.climb_force_n
      - drive.clutch_engage_kmh
      - drive.clutch_lock_kmh
      - form.width_overall_m
      - form.track_min_slope_m
      - battery.run_time_heavy_min
      - cost.total_l2_e1_w1_jpy
      - cost.total_cheap_new_w1_jpy
      - cost.total_donor_min_w1_jpy
      - cost.total_donor_w1_jpy
    tier: T2
    method: refute
    result: partial
    by: assistant
    date: 2026-11-03
    detail: A third independent helper recomputed the claims after the owner's second answers; every number matched its formula. Partial on what the text claimed - the climb was not checked for grip; the clutch's engagement and lock-up speeds came from two different clutches; a low child limit keeps a centrifugal clutch slipping; climbing at the lock speed is not slow; the overall width exceeded the widest opening only by rounding, and the narrowest opening was in the record but not cited; the battery margin is small; and the donor route left out a new wide axle and brake and treated the donor's ungoverned engine as E1. The record, calc/form_rough.py, and docs/02-form.md were changed on each point the same day; the simulator (with load transfer and rear-wheel spin) shows grip limiting the climb on grass.
  - id: K-004
    target:
      - dsn.ratio
      - dsn.tip_ratio_adult
      - dsn.axle_stress_mpa
      - dsn.rail_stress_mpa
      - dsn.climb_grip_n
      - dsn.brake_clamp_needed_n
      - dsn.width_transport_m
      - dsn.bom_parts_jpy
    tier: T2
    method: refute
    result: fail
    by: assistant
    date: 2026-11-03
    detail: An independent helper recomputed step 1.3 and searched docs/data/design.json for parts that collide. The arithmetic held, but the layout could not be built - the rear axle passed through the main rails and the axle cross member, the outer bearings were not joined to the frame, the seat sat on the drive and the brake, sprockets pierced the floor, the left side bar passed through the engine, the front tyre touched a side bar at full lock, the adult pedals lay inside the front cross member, and the hubs could not reach the transport track. Also the chains were rounded up and slack, the axle case left out the chain pull, the rail case was unfair, the sideways offset of the centre of mass and the downhill stop were left out, the transport width ignored the axle ends, and the text put the engine on the wrong side. calc/design.py, the design values, and docs/03-design.md were changed on each point the same day; the repairs wait for a re-check.
  - id: K-005
    target:
      - dsn.axle_rail_gap_mm
      - dsn.hub_bearing_gap_mm
      - dsn.axle_stress_mpa
      - dsn.rail_stress_mpa
      - dsn.brake_downhill_stop_m
      - dsn.tip_ratio_adult
      - dsn.width_transport_m
    tier: T2
    method: refute
    result: fail
    by: assistant
    date: 2026-11-03
    detail: A second independent helper re-checked the repairs of K-004. The rear rails now clear the axle, the seat and the rider clear the drive and the brake, the floor clears the sprockets, the chains are whole even links, and the load cases reproduce. Still not buildable - between the seat and the left rail there is no room for both chains, the jackshaft and its bearings, the middle axle bearing, and the guard, which overlap by up to about 10 mm; the column support runs through the column and the adult's shins; the pedal box rail runs through two cross members, so it cannot slide to the child position; the steering arms and tie rod ends touch the front rails; the middle bearing plate, the jackshaft plate, the floor, and the seat slide are joined to nothing, and the outer bearing plates miss the outriggers by 3 mm. Also the left rail carrying the overhung engine is at a safety factor of about 1.3, the cornering side force on the axle is not yet a load case, and the downhill stop is about 19 m with the braking load shift. These are left open in Q-020 for the next design pass.
  - id: K-006
    target:
      - dsn.ratio_top
      - dsn.top_speed_kmh
      - dsn.chain420_links
      - dsn.climb_grip_n
      - dsn.axle_stress_mpa
      - dsn.rail_stress_mpa
      - dsn.tip_ratio_adult
      - dsn.height_m
    tier: T2
    method: refute
    result: fail
    by: assistant
    date: 2026-11-04
    detail: A third independent helper checked the road-going design of D-022. The arithmetic reproduces, but the layout cannot be built - the left side bar, a column brace, and the rising left rail pass through the scooter unit; the axle sprocket and chain pass through the middle bearing plate; the guard is cut by the axle; the roll bar is no higher than a 170 cm adult's head, and a bar that clears it does not fit the Delica unless it folds; the rear turn signals and mirror stems collide with the braces; the mirrors face backward behind the eyes; the horn passes through a cross member and the battery through the seat; the hand-brake caliper and lever, the belt anchors, the head restraint, and several plates are joined to nothing; the fuel tank, ECU, regulator, and key switch are not placed; the silencer is placed where the donor's may not fit. The roll bar's mass was counted at the wrong tube size, corrected the same day. The 25 mm axle is marginal under a cornering load and the left rail carries the engine unit at a safety factor of about 1.2. The rest is open in Q-025.
  - id: K-007
    target:
      - hull.foam_m3
      - water.draft_mm
      - water.freeboard_mm
      - water.gm_m
      - water.load_rating_kg
      - sm.track_pressure_kpa
      - sm.tip_ratio
      - sm.clutch_lock_kmh
      - sm.top_speed_kmh
      - cost.winter_sm_jpy
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed every value of 1.2.14 and 1.2.15 by hand and checked the physics, the sources, and the comparisons in the text. The first round found five faults, all fixed the same day and passed on a second round - the foam was sized for the summer kart and is now sized for the heavier winter form; the outboard's battery was missing, which brings the tub's load rating just under the heaviest rider; P50 does not bar tracks for a moped and the text now says so; the kids' tracks and the smallest adult snowmobile lacked a source (S7 added, the claim limited to the listings); and the skipping speed was overstated as far beyond the top speed. The rear share ignores the skis and tub (about 0.71, not 0.73), within rough accuracy.
  - id: K-008
    target:
      - water.persons_index
      - water.persons_rated
      - water.beam_for_one_mm
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper checked the persons formula against the text of articles 102 and 103 of the Small Vessel Safety Rules (P55) and recomputed it by hand - index 0.607 (0.822 by the second formula), so nobody, and one person first at a beam of 1,160 mm. Taking the stern freeboard equal to the freeboard amidships is right for a level box; whether other articles limit the persons of a small boat was not checked.
  - id: K-009
    target:
      - sm.track_unit_kg
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed the winter form of 1.3.12 by hand and searched docs/data/design.json for interferences in the lifted winter form, in two rounds. The first found two errors (a bow of two panels called three; foam counted twice under the pod) and six interferences - the winter chain through the left pan strip and a cross member, hanging brackets through the pan and the floor, the slide rails' arms through the track's upper run, and a drive shaft too short. The design was changed - a wider tunnel, the cross member moved to 0.55 m, side plates beside the track carrying cross shafts inside the loop, the edge to the ski's outer corner, the belly counted with the track, stanchions and a chain guard added. The second round found all fixed but two new faults, the rear lugs drawn with the lift counted twice and the calipers through the right side plate; the assistant fixed both and checked the clearances from design.json (7 mm each). Clearances under 10 mm remain at the bow, the horn, the side plates' tops, and the chain to the left plate. The winter chain's 96 links sit at the boundary of the length formula. sm.removed_kg of 1.2 is not used by the design. Superseded when 1.3 was redone for the straddle kart (D-030), whose winter form is W5; the values it checked no longer exist, so it now points at the track unit.
  - id: K-010
    target:
      - mtt.tow_pull_packed_n
      - mtt.tow_sled_kg
      - mtt.crawler300_pair_kpa
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed the towing pull and sled mass, the crawlers' pressures, and the head and roll bar heights of 1.3.17 by hand; all reproduce and the physics is stated rightly. It found three overstated wordings (the 180 crawler not stated in stock, a pair of 300s beating rather than matching the donor's track, the base of twice the weight) and one claim without a source about tracks on pavement; all four were reworded the same day. The sitting height ratio comes from men of 18 to 29 and is applied to the tallest driver's stature. When 1.3 was redone for the straddle kart (D-030) the towing and crawler figures moved with their section to 1.2.17 and are recomputed there from the snowmobile form's numbers, which differ slightly and were not checked again; the roll bar figures no longer exist.
  - id: K-011
    target:
      - w4.share_min
      - w4.wheel_sink_cm
      - w4.grip_n
      - w4.resistance_n
      - w4.dual_wheel_sink_cm
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed the values of W4 by hand; all reproduce. It found that the conclusion that the tyres push rests on taking their resistance as P1's 0.18 of their load, outside P1's range at 24 cm of sinkage - Bekker's work of pressing the ruts gives about 490 N for two tyres and reverses it - and that a cold start doubles the pan's resistance; it also found the floe run of P63 attributed to the Girling sledge without the note saying so, and P2's snows called denser than powder without a source. The text now gives both estimates of the tyres' resistance and large tyres that push under both (w4.big_*), names the floe machine as likely the same, and softens the P2 claim.
  - id: K-012
    target:
      - st.cg_height_m
      - st.tip_ratio
      - st.pitch_ratio
      - st.length_m
      - st.child_fit_margin_mm
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed the straddle kart's centre of mass, ratios, size, and the child's fit by hand; all reproduce and the physics is stated rightly. It found the 198,000 JPY buggy described as registered as a minicar when its listing only says road-usable, a makers' argument attributed to P68 that its note does not hold, the helmet rule stated beyond minicars, the kart said to be sized like quads whose track is narrower, the saving rounded up and not net of a second caliper, and the tilt-table wording vague with a fore-and-aft margin of only 0.02; all were reworded the same day.
  - id: K-013
    target:
      - dsn.tip_ratio_adult
      - dsn.pitch_ratio_adult
      - dsn.winter_tip_ratio
      - dsn.axle_stress_mpa
      - dsn.rail_safety
      - dsn.brake_downhill_decel
    tier: T2
    method: refute
    result: fail
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed the straddle kart of 1.3 by hand - every main value reproduced - and searched design.json for interferences. It found the winter fore-and-aft ratio not computed (0.65 against 0.8), the winter top speed over 30 km/h, the axle's torsion and the forward load transfer in braking left out, about 2 to 5 kg of parts missing from the masses, the rear turn signals inside the large winter tyres, the 45T sprocket against the outriggers, the chain guard through the middle bearing, the heel pinned at the footboard's front edge with the toes reaching the front tyres at full lock, and several wordings. The same day the wheelbase grew to 1.08 m with a shorter front overhang, a 12T winter output sprocket holds 30 km/h, the axle stress is combined by von Mises, the braking is shared between the axles, the outriggers, guard, turn signals, mirrors, and front calipers moved, and the masses were completed. It stays a fail because the spine's safety factor is 0.85 and the winter fore-and-aft ratio 0.65; these and the remaining small clearances are in Q-035.
