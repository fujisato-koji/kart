    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed every value of 1.2.14 and 1.2.15 by hand and checked the physics, the sources, and the comparisons in the text. The first round found five faults, all fixed the same day and passed on a second round - the foam was sized for the summer kart and is now sized for the heavier winter form; the outboard's battery was missing, which brings the tub's load rating just under the heaviest rider; P50 does not bar tracks for a moped and the text now says so; the kids' tracks and the smallest adult snowmobile lacked a source (S7 added, the claim limited to the listings); and the skipping speed was overstated as far beyond the top speed. The rear share ignores the skis and tub (about 0.71, not 0.73), within rough accuracy.
  - id: K-008
    target:
      - water.persons_index
      - water.persons_rated
      - water.beam_for_one_mm
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper checked the persons formula against the text of articles 102 and 103 of the Small Vessel Safety Rules (P55) and recomputed it by hand - index 0.607 (0.822 by the second formula), so nobody, and one person first at a beam of 1,160 mm. Taking the stern freeboard equal to the freeboard amidships is right for a level box; whether other articles limit the persons of a small boat was not checked.
  - id: K-009
    target:
      - sm.track_unit_kg
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed the winter form of 1.3.12 by hand and searched docs/data/design.json for interferences in the lifted winter form, in two rounds. The first found two errors (a bow of two panels called three; foam counted twice under the pod) and six interferences - the winter chain through the left pan strip and a cross member, hanging brackets through the pan and the floor, the slide rails' arms through the track's upper run, and a drive shaft too short. The design was changed - a wider tunnel, the cross member moved to 0.55 m, side plates beside the track carrying cross shafts inside the loop, the edge to the ski's outer corner, the belly counted with the track, stanchions and a chain guard added. The second round found all fixed but two new faults, the rear lugs drawn with the lift counted twice and the calipers through the right side plate; the assistant fixed both and checked the clearances from design.json (7 mm each). Clearances under 10 mm remain at the bow, the horn, the side plates' tops, and the chain to the left plate. The winter chain's 96 links sit at the boundary of the length formula. sm.removed_kg of 1.2 is not used by the design. Superseded when 1.3 was redone for the straddle kart (D-030), whose winter form is W5; the values it checked no longer exist, so it now points at the track unit.
  - id: K-010
    target:
      - mtt.tow_pull_packed_n
      - mtt.tow_sled_kg
      - mtt.crawler300_pair_kpa
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed the towing pull and sled mass, the crawlers' pressures, and the head and roll bar heights of 1.3.17 by hand; all reproduce and the physics is stated rightly. It found three overstated wordings (the 180 crawler not stated in stock, a pair of 300s beating rather than matching the donor's track, the base of twice the weight) and one claim without a source about tracks on pavement; all four were reworded the same day. The sitting height ratio comes from men of 18 to 29 and is applied to the tallest driver's stature. When 1.3 was redone for the straddle kart (D-030) the towing and crawler figures moved with their section to 1.2.17 and are recomputed there from the snowmobile form's numbers, which differ slightly and were not checked again; the roll bar figures no longer exist.
  - id: K-011
    target:
      - w4.share_min
      - w4.wheel_sink_cm
      - w4.grip_n
      - w4.resistance_n
      - w4.dual_wheel_sink_cm
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed the values of W4 by hand; all reproduce. It found that the conclusion that the tyres push rests on taking their resistance as P1's 0.18 of their load, outside P1's range at 24 cm of sinkage - Bekker's work of pressing the ruts gives about 490 N for two tyres and reverses it - and that a cold start doubles the pan's resistance; it also found the floe run of P63 attributed to the Girling sledge without the note saying so, and P2's snows called denser than powder without a source. The text now gives both estimates of the tyres' resistance and large tyres that push under both (w4.big_*), names the floe machine as likely the same, and softens the P2 claim.
  - id: K-012
    target:
      - st.cg_height_m
      - st.tip_ratio
      - st.pitch_ratio
      - st.length_m
      - st.child_fit_margin_mm
    tier: T2
    method: refute
    result: pass
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed the straddle kart's centre of mass, ratios, size, and the child's fit by hand; all reproduce and the physics is stated rightly. It found the 198,000 JPY buggy described as registered as a minicar when its listing only says road-usable, a makers' argument attributed to P68 that its note does not hold, the helmet rule stated beyond minicars, the kart said to be sized like quads whose track is narrower, the saving rounded up and not net of a second caliper, and the tilt-table wording vague with a fore-and-aft margin of only 0.02; all were reworded the same day.
  - id: K-013
    target:
      - dsn.tip_ratio_adult
      - dsn.pitch_ratio_adult
      - dsn.winter_tip_ratio
      - dsn.axle_stress_mpa
      - dsn.rail_safety
      - dsn.brake_downhill_decel
    tier: T2
    method: refute
    result: fail
    by: assistant
    date: 2026-11-04
    detail: An independent helper recomputed the straddle kart of 1.3 by hand - every main value reproduced - and searched design.json for interferences. It found the winter fore-and-aft ratio not computed (0.65 against 0.8), the winter top speed over 30 km/h, the axle's torsion and the forward load transfer in braking left out, about 2 to 5 kg of parts missing from the masses, the rear turn signals inside the large winter tyres, the 45T sprocket against the outriggers, the chain guard through the middle bearing, the heel pinned at the footboard's front edge with the toes reaching the front tyres at full lock, and several wordings. The same day the wheelbase grew to 1.08 m with a shorter front overhang, a 12T winter output sprocket holds 30 km/h, the axle stress is combined by von Mises, the braking is shared between the axles, the outriggers, guard, turn signals, mirrors, and front calipers moved, and the masses were completed. It stays a fail because the spine's safety factor is 0.85 and the winter fore-and-aft ratio 0.65; these and the remaining small clearances are in Q-035.
  - id: K-014
    target:
      - load.bump_g
      - load.twist_rough
      - load.impact_g
      - load.hoop_crush_n_per_kg
      - land.shock_eff
      - fat.gamma_mf
      - dsn.rail_safety
      - dsn.impact_safety
      - dsn.hoop_crush_safety
      - dsn.landing_rear_g
      - dsn.fatigue_g_tube
      - dsn.clearance_bump_rear_mm
    tier: T2
    method: refute
    result: partial
    by: assistant
    date: 2026-11-04
    detail: An independent helper fetched every source of 1.3.18 and 1.3.19 and found the values as recorded, and tested calc/frame.py against hand formulas in 40 cases (cantilevers, beams, torsion, the hinge, links) to within 0.08 %. It refuted the shock's energy efficiency of 0.8, which the source gives for a metered oleo, not a steel spring (about 0.5), so the rear lands harder; a frontal 4 g below the scaled range of 4.3 to 5.4 g; fatigue taken from the seated bump only, which one lifted wheel exceeds by 30 %, with the lowest partial factor; a life misstated as a few hundred kilometres; the pan's clearance in a full bump (66 mm, not 78); and two quad clearances outside their notes. The frame's shortfall and the axle's held under every other modelling choice it tried; the bumper's only against a narrow obstacle (against a wall the tyres strike first); the hoop's depends on how it is loaded. All were corrected the same day - shock efficiency 0.5, impact 5 g, fatigue from the worst case with a partial factor of 1.35, the clearance from the pan, the quads' range - and the hoop's loading is stated in Q-040.
  - id: K-015
    target:
      - dsn.landing_front_g
      - dsn.front_motion_ratio
      - dsn.front_shock_spring_n_mm
      - dsn.tie_rod_change_heave_mm
      - dsn.arm_safety
      - dsn.impact_safety
      - dsn.fatigue_life_ratio
      - dsn.clashes_summer
      - dsn.clashes_winter
    tier: T2
    method: refute
    result: partial
    by: assistant
    date: 2026-11-04
    detail: An independent helper re-derived the front swing axles' motion ratio (0.443), wheel rate, spring, static force, camber change, and landing factor, and the bump steer at straight steering (under 0.1 mm), all as recorded; at full lock the bump steer is about 0.9 mm. It refuted the frame analysis's front supports at the kingpins rather than at the wheels, which shortened the swing axles' lever and flattered the arms and the fatigue life (life ratio 0.57 against 1.44 recorded), the worst fatigue member named in 1.3.18, an impact case that left out a post meeting one end of the bumper (safety factor 0.90) and front tyres that reach past the bumper, and joint spheres that hid the pitman arm cutting a frame tube at full lock and the front shocks' top eyes inside the tower's tubes. All were corrected the same day - the front held at the wheels' centres through stiff stubs, the swing arm's rear cross tube and a keel of larger tubes, the offset impact added and the bumper moved ahead of the tyres, the stem's lower bearing and the tower's posts moved clear of the pitman arm and the shocks, and the search re-run with the joint spheres removed to find nothing hidden but pivots, flange plates, and welds.
  - id: K-016
    target:
      - Q-043
      - P83
      - P85
      - cost.atv_aarm_set_jpy
    tier: T2
    method: refute
    result: partial
    by: assistant
    date: 2026-11-04
    detail: An independent helper checked the first version of 1.2.20 against its sources and re-derived its sketches. It confirmed the requirements' sources and the swing axle's bump steer (about 0.1 mm). It refuted - the TRX90X row (single A-arms and the stem's bush and bearing are not in P83); the Chinese 110 cc kingpin given as fact where it is read from a drawing, and its plate's weakness resting on one owner's report; the inference that the double-arm 90 to 110 cc machines are the nearer models (the Raptor 90 is rated 70 kg and no precedent is known to carry this kart's load); the bought knuckles called kingpin knuckles though the seller does not say; the swing axle's camber change given for bump only (about 11.5 degrees over the whole travel, not 6.6); the double A-arms' freedom from bump steer, which the sketch did not have (4 to 7 degrees, its tie rods' inner ends off the arms' pivot line); the lower arm's bending where the shock comes in, left unsaid; sketches whose tie rods stopped short of the knuckles, whose stem bearings sat on no tube, whose shock was 418 mm against 240 to 290 mm sold, and whose front panel was not triangulated; the leading-arm form of P81 and P86 left out; and the A-arm set's contents and number not stated, so its price may cover one side. All were corrected the same day - the precedents rewritten to what their sources say, a fourth form added, the sketches redrawn with every steering joint, bearings and shock tops at frame nodes, sold shock lengths, and triangulated panels, and the camber, toe, caster, and shock lengths computed by moving the sketched points over the whole travel (calc/front_forms.py), which put the double A-arms' toe change at 0.03 degree with the tie rods' inner ends on the pivot line.
  - id: K-017
    target:
      - D-041
      - dsn.front_camber_change_deg
      - dsn.bump_steer_deg
      - dsn.bump_steer_lock_deg
      - dsn.steer_outer_deg
      - dsn.front_motion_ratio
      - dsn.arm_safety
      - dsn.impact_safety
      - dsn.clashes_summer
      - dsn.clashes_winter
    tier: T2
    method: refute
    result: partial
    by: assistant
    date: 2026-11-05
    detail: An independent helper re-derived the double A-arms of 1.3.20 with its own solver (the knuckle's pose from the arms' legs and the tie rod), the lock, the frame model, and two stresses by hand. It confirmed the camber, track, and toe changes, the shock's lengths, the lock's angles with the tie rods holding their length, a frame model with no mechanism, wrong hinge, or name collision, and the arms' stress, the shocks' and tie rods' forces, and the impact factor (the shock's force by hand within a few per cent, the lower arm's bending within 3 per cent). It refuted - an interference the sweep never visited, the inner wheel at the lock and full droop 2 mm into the sled pan's front corner; a camber that went top out as the wheel rose, which leans the outer wheel out in a turn; the open bay's shear said to pass through the stem, which carries almost none of it (the bay works in bending, up to 48 MPa); a safety factor quoted above 5 that is 4.7, a shock force of 3.5 times its load at rest that is 3.8 standing, and a toe change of 1.4 to 2.8 degrees for the other arm angle that no calculation gave; the largest frame stress placed in the spine rather than a footboard's cross tube; the tyre said near the lower arm's end at the lock when it is so in every position; FE-04 claimed though the front lands at 4.6 g against the 3.5 g bump; and two stale comments. All were corrected the same day - the sweep now visits both sides and each side at bump and droop, straight and at the lock both ways, and the pan was narrowed to clear the wheel; the upper joint was raised so that the wheel's top leans in as it rises; the bay's bending is a value (dsn.nose_bay_stress_mpa); the other arm angle is calculated (dsn.steer_outer_alt_deg, dsn.bump_steer_alt_deg); and the text, FE-04, and Q-044 say what the numbers say.
  - id: K-018
    target:
      - dsn.box_od_mm
      - dsn.farm_upper_od_mm
      - dsn.rail_safety
      - dsn.impact_safety
      - dsn.fatigue_life_ratio
      - dsn.frame_mass_kg
    tier: T2
    method: refute
    result: partial
    by: assistant
    date: 2026-11-05
    detail: An independent helper ran the frame before and after the trim of 1.3.21 and re-solved every case with its own scripts. It confirmed the stress map - at the tubes' ends it equals the solver's stresses, the moment's sign checks by statics and by a four-point bending case by hand, and tubes split into four elements give the same stresses along them; the first reading (37 tubes, 6.7 m, under 15 % and 6 over 60 %); and after the trim the driving factor 2.33, the arms' 3.39, the impact factor 2.02, the hoop's 2.98 and 4.26, a fatigue range of 35.5 MPa under the tube joints' limit of 38.75 MPa, a kart of 144.9 kg, and no clashes. Without the V braces the box is no mechanism - a sideways kilonewton at a top corner moves it 0.13 mm against 0.07 mm before - and each case's largest stress changes by 5 % or less; a 2 g sideways blow at one front tyre and a 200 kg weight on the box's top rail stay well inside the tubes' strength, and no tube comes near buckling. It refuted the frame's mass before the trim (33.0 kg, not 34.7, so 4.6 kg saved), the braces' use (under 4 %, not 3 to 8 %), the posts' size named as the upper arms' value, and a tube length of the smaller size that included the middle one, and it noted that the map's fatigue colours are a tube joint's, so a tube with a fillet-welded plate would show far less than its use. All were corrected the same day.
  - id: K-019
    target:
      - D-042
      - dsn.motion_ratio
      - dsn.shock_stroke_used_mm
      - dsn.impact_safety
      - dsn.hoop_crush_safety
      - dsn.frame_mass_kg
    tier: T2
    method: refute
    result: partial
    by: assistant
    date: 2026-11-05
    detail: An independent helper ran the new frame ends of D-042 against the frame before them, re-solved every case, searched the rear shock's layouts on its own, and ran the interference search with and without the joints' spheres. It confirmed the rear shock's laden length and stroke, the shock's top on the hoop's cross tube, the frame's safety factors, no mechanism at either end, and no clashes. It refuted - the claim that a pivot right on the spine rails admits no single directly acting shock (its own search found hundreds of layouts, a lug low behind the pivot giving a steadier ratio; the assistant's search had the arm's angle the wrong way round, and the owner had moved to the higher pivot on that claim); a motion ratio falling from 0.65 to 0.37 over the travel, left unsaid; a lug so short that the shock's eye sat in the hoop's cross tube; the arms' and the hoop's side factors quoted wrongly; a bumper only 157 mm between its posts, which a post more than 0.1 m off centre would pass to reach a tyre or an arm; a blow on one end said to go straight back, where it bends the posts; the rear lamps without a bracket; and stale text on the posts, the struts, and the earlier trim. All were corrected the same day - the owner, shown both pivots, kept the higher one for the chain (about 14 mm of change in its centre distance against 45 mm); the shock's lower eye moved to where its ratio falls least while its eye stays clear of the arm's brace (0.73 to 0.47), the upper lug lengthened, the bumper's bar widened to the old bumper's width, the lamps given a bracket, and the text corrected.
  - id: K-020
    target:
      - D-043
      - dsn.chain420_links
      - dsn.chain_centre_change_mm
      - dsn.chain_takeup_mm
      - dsn.motion_ratio
      - dsn.shock_stroke_used_mm
      - dsn.clashes_summer
    tier: T2
    method: refute
    result: partial
    by: assistant
    date: 2026-11-05
    detail: An independent helper recomputed the chain's centre distance over the whole travel in 0.5 mm steps, rebuilt the design with the pivot at other places along the line from the output to the axle, worked out the arm brace's clearances and its joint, reproduced the rear shock's ratios and stroke, and ran the interference search with and without the joints' spheres. It confirmed that with the pivot on that line the distance is longest at rest and changes by 1.8 mm, that the 76-link chain is long enough everywhere with at most 6 mm for the tensioner, that the old chain was 0.78 links short at full bump, and that nothing clashed. It refuted - the old chain pulling tight about 8 mm into the bump (about 6 mm); the pivot meeting the final gear's case just forward of its place (about 10 mm of room, the belt drive's drum nearer); a brace dropped 30 mm below the arm's sides as a weld (its axis below the side tubes' bottoms, most of its end in the air), which also stood as a rigid stub in the line model; the shock's eye said to give the steadiest ratio; and the interference search, whose joint spheres hid the brace meeting a rising tube and would still pass a pivot 15 mm further back. All were corrected the same day - the rising tubes go straight up through the pivot tube to a knee above the brace's reach and the arm keeps its D-042 form with its brace at the bend, the text gives the 6 mm and the room forward, and a joint sphere now excuses only contacts between bodies that move together or at a pivot, which brings the front tyre within 4.7 mm of the lower arm's end (Q-044) into the count.
  - id: K-021
    target:
